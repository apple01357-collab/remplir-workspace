<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WORKSPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090d;--sur:#0e1016;--sur2:#141720;--sur3:#1a1e28;
  --bdr:#1c2030;--bdr2:#252b3b;
  --tx:#d8dce8;--tx2:#7c85a2;--tx3:#3f4660;
  --acc:#4f7fff;--acc2:rgba(79,127,255,.12);
  --task:#4f7fff;--issue:#ff5c5c;--idea:#f5c542;--supply:#48c78e;
  --warn:#f5c542;--ok:#48c78e;--err:#ff5c5c;
  --r:12px;--r2:9px;--r3:6px;
  --nav-h:56px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:28px;height:28px;border:3px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--tx3)}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:310px;background:var(--sur);border:1.5px solid var(--bdr2);border-radius:18px;padding:26px 22px}
.login-logo{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;letter-spacing:3px;margin-bottom:4px}
.login-logo span{color:var(--acc)}
.login-sub{font-size:11px;color:var(--tx3);margin-bottom:22px;line-height:1.6}
.l-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.8px;margin-bottom:5px}
.l-inp{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r2);padding:11px 12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;transition:border-color .18s;margin-bottom:11px;-webkit-appearance:none}
.l-inp:focus{border-color:var(--acc)}
.l-inp::placeholder{color:var(--tx3)}
.l-rem{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--tx2);cursor:pointer}
.l-rem input{accent-color:var(--acc);width:15px;height:15px}
.l-btn{width:100%;background:var(--acc);border:none;border-radius:var(--r2);padding:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none}
.l-err{font-size:12px;color:var(--err);margin-top:9px;min-height:16px;text-align:center}

/* APP */
#app{display:none;flex-direction:column;height:100dvh;height:100vh}

/* TOPBAR */
#topbar{display:flex;align-items:center;padding:8px 14px;padding-top:max(8px,var(--st));border-bottom:1px solid var(--bdr);flex-shrink:0;gap:8px;background:var(--bg)}
.logo{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:3px}
.logo span{color:var(--acc)}
#tb-date{font-size:11px;color:var(--tx3)}
#sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);transition:background .3s;flex-shrink:0}
#sync-dot.syncing{background:var(--warn);animation:blink .8s infinite}
#sync-dot.err{background:var(--err)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.user-pill{margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--sur2);border:1px solid var(--bdr2);border-radius:20px;padding:3px 8px 3px 4px}
.u-av{width:20px;height:20px;border-radius:50%;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--acc)}
.u-nm{font-size:11px;font-weight:600}
.u-rl{font-size:10px;color:var(--tx3)}
.logout-btn{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:11px;padding:2px 5px;font-family:'Noto Sans KR',sans-serif}

/* PC NAV */
#pc-nav{display:flex;padding:0 16px;border-bottom:1px solid var(--bdr);flex-shrink:0;gap:2px;overflow-x:auto;scrollbar-width:none}
#pc-nav::-webkit-scrollbar{display:none}
.nav-tab{padding:9px 13px;font-size:12px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:'Noto Sans KR',sans-serif}
.nav-tab.active{color:var(--tx);border-bottom-color:var(--acc)}

/* PAGES */
#pages{flex:1;overflow:hidden;display:flex;min-height:0}
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}
#page-dash{flex-direction:row}

/* SCROLL */
.sa{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sa::-webkit-scrollbar{width:3px}
.sa::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}

/* DASH */
#dash-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.dash-pad{padding:13px;padding-bottom:calc(13px + var(--sb))}

.group-row{display:flex;gap:5px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex-wrap:nowrap}
.group-row::-webkit-scrollbar{display:none}
.gc{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--sur);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.gc.active{border-color:var(--acc);background:var(--acc2)}
.gc-cnt{font-size:12px;font-weight:700}
.gc-lbl{font-size:11px;color:var(--tx3)}

#ctx-bar{display:none;margin-bottom:9px;background:var(--sur2);border:1px solid var(--bdr2);border-radius:var(--r2);padding:6px 10px;gap:5px;flex-wrap:wrap;align-items:center}
#ctx-bar.show{display:flex}
.ctx-chip{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--sur3);border:1px solid var(--bdr2);color:var(--tx2);cursor:pointer}
.ctx-chip.active{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.ctx-rst{margin-left:auto;background:none;border:none;color:var(--tx3);font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}

.list-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.list-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px}
.list-cnt{font-size:11px;color:var(--tx3)}
#item-list{display:flex;flex-direction:column;gap:3px}

/* ITEM CARD */
.ic{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r2);background:var(--sur);border:1px solid var(--bdr);cursor:pointer;transition:background .15s;-webkit-user-select:none;user-select:none}
.ic:active{background:var(--sur2)}
@media(hover:hover){.ic:hover{background:var(--sur2);border-color:var(--bdr2)}}
.ic-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-t{background:var(--task)}.dot-i{background:var(--issue)}.dot-d{background:var(--idea)}.dot-s{background:var(--supply)}
.ic-text{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-meta{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ic-done{opacity:.35}.ic-done .ic-text{text-decoration:line-through}
.cat-tag{font-size:10px;background:var(--sur2);border:1px solid var(--bdr2);border-radius:3px;padding:1px 5px;color:var(--tx2)}
.prj-tag{font-size:10px;font-weight:600;background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.22);border-radius:3px;padding:1px 6px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio-dot{color:var(--err);font-size:10px;flex-shrink:0}
.dday{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.dd-u{background:rgba(255,92,92,.15);color:var(--err)}.dd-s{background:rgba(245,197,66,.12);color:var(--warn)}.dd-ok{background:rgba(72,199,142,.1);color:var(--ok)}
.prog{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.pn{background:var(--sur3);color:var(--tx3);border:1px solid var(--bdr2)}
.pi{background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.25)}
.pd{background:rgba(72,199,142,.1);color:var(--ok);border:1px solid rgba(72,199,142,.2)}
.pbn{background:rgba(245,197,66,.1);color:var(--warn);border:1px solid rgba(245,197,66,.2)}
.pbi{background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.25)}
.pbd{background:rgba(72,199,142,.1);color:var(--ok);border:1px solid rgba(72,199,142,.2)}

.empty{display:flex;flex-direction:column;align-items:center;padding:36px 0;color:var(--tx3);gap:6px}
.empty-icon{font-size:22px;opacity:.4}.empty-text{font-size:12px}

/* INPUT PANEL (PC) */
#inp-panel{width:280px;flex-shrink:0;background:var(--sur);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:11px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.ph-title{font-size:12px;font-weight:700;margin-bottom:1px}
.ph-sub{font-size:11px;color:var(--tx3)}
.pb{flex:1;overflow-y:auto;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.pb::-webkit-scrollbar{width:3px}
.pb::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.p-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:4px}
.p-sel,.p-inp,.p-ta{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r2);padding:7px 9px;font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none;transition:border-color .18s;-webkit-appearance:none}
.p-sel:focus,.p-inp:focus,.p-ta:focus{border-color:var(--acc)}
.p-sel option{background:var(--sur2)}
.p-ta{resize:none;min-height:58px;line-height:1.6}
.p-inp::placeholder,.p-ta::placeholder{color:var(--tx3)}
.p-submit{width:100%;background:var(--acc);border:none;border-radius:var(--r2);padding:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none}
.ptog{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx3);border-radius:var(--r2);padding:7px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.ptog.hi{background:rgba(255,92,92,.1);border-color:var(--err);color:var(--err)}

/* TODAY */
#page-today{overflow:hidden}
.today-pad{padding:16px;padding-bottom:calc(16px + var(--sb))}
.today-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.today-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.today-sub{font-size:11px;color:var(--tx3)}
.today-sec{margin-bottom:18px}
.tsec-title{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.tsec-title::after{content:'';flex:1;height:1px;background:var(--bdr)}
.t-items{display:flex;flex-direction:column;gap:3px}

/* PROJECT */
#page-project{overflow:hidden}
.proj-pad{padding:16px;padding-bottom:calc(16px + var(--sb))}
.proj-topbar{display:flex;align-items:center;margin-bottom:14px}
.proj-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
.proj-add-btn{margin-left:auto;background:var(--acc);border:none;border-radius:var(--r2);padding:7px 13px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.proj-card{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--r);padding:13px;cursor:pointer;transition:all .18s}
.proj-card:active{background:var(--sur2)}
@media(hover:hover){.proj-card:hover{background:var(--sur2);border-color:var(--bdr2)}}
.pc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.pc-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pc-name{font-size:13px;font-weight:700;margin-bottom:2px}
.ps-badge{font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;display:inline-block}
.ps-a{background:rgba(79,127,255,.1);color:var(--acc)}.ps-h{background:rgba(245,197,66,.1);color:var(--warn)}.ps-d{background:rgba(72,199,142,.1);color:var(--ok)}
.pc-desc{font-size:11px;color:var(--tx3);line-height:1.6;margin-bottom:7px}
.pc-meta{display:flex;gap:7px;font-size:10px;color:var(--tx3);flex-wrap:wrap}

/* DRAWER */
#dov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
#dov.open{opacity:1;pointer-events:all}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--sur);border-left:1px solid var(--bdr2);z-index:101;transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
#drawer.open{transform:translateX(0)}
#dw-head{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;padding-top:max(13px,var(--st));border-bottom:1px solid var(--bdr);flex-shrink:0}
#dw-title{flex:1;font-size:14px;font-weight:700;line-height:1.5}
#dw-close{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
#dw-body{flex:1;overflow-y:auto;padding:13px 15px;-webkit-overflow-scrolling:touch}
#dw-body::-webkit-scrollbar{width:3px}
#dw-body::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.dw-field{margin-bottom:13px}
.dw-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:5px}
.dw-inp,.dw-ta,.dw-sel{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r2);padding:9px 11px;font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;transition:border-color .18s;-webkit-appearance:none}
.dw-inp:focus,.dw-ta:focus,.dw-sel:focus{border-color:var(--acc)}
.dw-ta{resize:vertical;min-height:76px;line-height:1.6}
.dw-sel option{background:var(--sur2)}
.dw-row{display:flex;gap:8px;margin-bottom:13px}
.dw-row .dw-field{flex:1;margin-bottom:0}
#dw-acts{display:flex;gap:8px;padding:11px 15px;padding-bottom:max(11px,var(--sb));border-top:1px solid var(--bdr);flex-shrink:0}
.d-btn{flex:1;border:none;border-radius:var(--r2);padding:11px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.d-primary{background:var(--acc);color:#fff}
.d-danger{background:none;border:1px solid rgba(255,92,92,.3);color:var(--err)}
.dw-ptog{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx3);border-radius:var(--r2);padding:9px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.dw-ptog.hi{background:rgba(255,92,92,.1);border-color:var(--err);color:var(--err)}

.prj-link{background:var(--sur2);border:1px solid var(--bdr2);border-radius:var(--r2);padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prj-link-name{font-size:12px;font-weight:600;color:var(--acc);flex:1}
.prj-link-none{font-size:12px;color:var(--tx3)}
.prj-unlink{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:12px}
.sdiv{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin:13px 0 9px;display:flex;align-items:center;gap:7px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--bdr)}
.proc-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px}
.proc-lbl{font-size:11px;font-weight:700;color:var(--tx2);min-width:58px;padding-top:8px;flex-shrink:0}
.proc-inp{flex:1;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r3);padding:7px 9px;font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none;transition:border-color .18s;resize:none;min-height:32px;line-height:1.5}
.proc-inp:focus{border-color:var(--acc)}
.proc-inp::placeholder{color:var(--tx3)}
.mem-row{display:flex;align-items:center;gap:7px;background:var(--sur2);border-radius:var(--r3);padding:6px 9px;margin-bottom:4px}
.mem-name{flex:1;font-size:12px}.mem-role{font-size:11px;color:var(--tx3)}
.mem-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:13px}
.mem-add{display:flex;gap:5px;margin:7px 0}
.add-mem-btn{background:none;border:1px solid var(--bdr2);color:var(--tx2);border-radius:var(--r3);padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.com-item{background:var(--sur2);border-radius:var(--r3);padding:8px 10px;font-size:12px;margin-bottom:5px}
.com-meta{font-size:10px;color:var(--tx3);margin-bottom:3px}
.com-text{color:var(--tx2);line-height:1.6}
.com-form{display:flex;gap:6px}
.com-send{background:var(--acc);border:none;border-radius:var(--r3);padding:8px 12px;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0}

/* MODAL */
#pm-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#pm-ov.open{opacity:1;pointer-events:all}
#pm-box{background:var(--sur);border:1.5px solid var(--bdr2);border-radius:16px;padding:22px 20px;width:100%;max-width:330px;transform:scale(.96);transition:transform .2s}
#pm-ov.open #pm-box{transform:scale(1)}
.m-title{font-size:14px;font-weight:700;margin-bottom:14px}
.m-field{margin-bottom:11px}
.m-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:5px}
.m-acts{display:flex;gap:8px;margin-top:14px}
.m-btn{flex:1;border:none;border-radius:var(--r2);padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.m-primary{background:var(--acc);color:#fff}
.m-ghost{background:none;border:1px solid var(--bdr2);color:var(--tx2)}

/* BOTTOM NAV */
#bnav{display:none;flex-shrink:0;border-top:1px solid var(--bdr);background:var(--bg);padding-bottom:var(--sb);min-height:var(--nav-h)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;gap:3px;background:none;border:none;color:var(--tx3);font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.bnav-btn.active{color:var(--acc)}
.bnav-ico{font-size:18px;line-height:1}
.bnav-lbl{font-size:9px;font-weight:600}

/* INPUT SHEET (mobile) */
#inp-sheet{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
#inp-sheet.open{opacity:1;pointer-events:all}
#inp-sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#inp-sheet-body{position:relative;background:var(--sur);border-radius:20px 20px 0 0;border-top:1px solid var(--bdr2);max-height:88dvh;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--sb)}
.sheet-handle{width:34px;height:4px;background:var(--bdr2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sheet-title{font-size:14px;font-weight:700}
.sheet-x{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer}
.sheet-scroll{flex:1;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.sheet-scroll::-webkit-scrollbar{display:none}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 14px + var(--sb));left:50%;transform:translateX(-50%) translateY(6px);background:var(--sur2);border:1px solid var(--bdr2);border-radius:10px;padding:9px 16px;font-size:12px;font-weight:600;color:var(--tx);opacity:0;transition:all .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* FAB */
#fab{position:fixed;bottom:calc(var(--nav-h) + 12px + var(--sb));right:16px;z-index:50;width:46px;height:46px;border-radius:13px;background:var(--acc);border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(79,127,255,.4);display:none;align-items:center;justify-content:center}

/* RESPONSIVE */
/* 모바일/PC 레이아웃은 JS updateLayout()으로 제어 */
@media(max-width:768px){
  #page-dash{flex-direction:column}
  .dash-pad,.today-pad,.proj-pad,.acct-pad,.review-pad{padding-bottom:calc(13px + var(--nav-h) + var(--sb))}
}

/* ── TIMELINE ── */
.tl-wrap{margin-top:6px}
.tl-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--bdr);
  position:relative;
}
.tl-item:last-child{border-bottom:none}
.tl-item.tl-done .tl-text{opacity:.5;text-decoration:line-through}
.tl-left{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:14px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid var(--bdr2);background:var(--sur2)}
.tl-dot.done{background:var(--ok);border-color:var(--ok)}
.tl-dot.ing{background:var(--acc);border-color:var(--acc)}
.tl-dot.none-dot{background:var(--sur3);border-color:var(--bdr2)}
.tl-line{width:2px;flex:1;background:var(--bdr);min-height:14px}
.tl-right{flex:1;min-width:0}
.tl-text{font-size:12px;color:var(--tx);line-height:1.4;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-prog{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.tl-type{font-size:10px;color:var(--tx3)}
.tl-due{font-size:10px;color:var(--tx3)}
.tl-due.overdue{color:var(--err)}
.tl-toggle{
  width:100%;background:none;border:1px solid var(--bdr2);color:var(--tx3);
  border-radius:var(--r3);padding:6px;font-size:11px;font-weight:600;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s
}
.tl-toggle:hover{border-color:var(--acc);color:var(--acc)}
.tl-hidden{display:none}

@media(max-width:768px){
  #tb-date{display:none}
  .u-rl{display:none}
  .logout-btn{font-size:10px;padding:2px 4px;font-weight:700;letter-spacing:.5px}
  .u-nm{font-size:11px}
}

/* ── ACCOUNT PAGE ── */
#page-account{overflow:hidden}
.acct-pad{padding:16px;padding-bottom:calc(16px + var(--nav-h) + var(--sb));max-width:520px;margin:0 auto;width:100%}
.acct-section{margin-bottom:24px}
.acct-sec-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:16px}
.acct-card{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:10px}
.acct-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.acct-row:last-child{border-bottom:none}
.acct-id{flex:1;font-size:13px;font-weight:700}
.acct-realname{font-size:11px;color:var(--tx3);margin-top:2px}
.acct-role-badge{font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px}
.arb-admin{background:rgba(255,92,92,.1);color:var(--err);border:1px solid rgba(255,92,92,.2)}
.arb-user{background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.2)}
.acct-del-btn{background:none;border:1px solid rgba(255,92,92,.25);color:var(--err);font-size:11px;font-weight:700;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.acct-del-btn:hover{background:rgba(255,92,92,.1)}
.add-acct-form{display:flex;flex-direction:column;gap:9px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)}
.form-row{display:flex;gap:8px}
.form-row .dw-inp{flex:1}
.acct-submit{background:var(--acc);border:none;border-radius:var(--r2);padding:11px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:100%}
.my-info-card{background:var(--sur2);border:1.5px solid var(--bdr2);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.my-info-label{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.8px;margin-bottom:4px}
.my-info-val{font-size:15px;font-weight:700;margin-bottom:2px}
.my-info-sub{font-size:11px;color:var(--tx3)}
.pw-form{display:flex;flex-direction:column;gap:9px}
.form-err{font-size:12px;color:var(--err);min-height:16px}
.form-ok{font-size:12px;color:var(--ok);min-height:16px}

/* ── NEW badge & ADMIN tab ── */
.new-badge{
  font-size:9px;font-weight:800;letter-spacing:.5px;
  background:var(--err);color:#fff;border-radius:4px;
  padding:1px 5px;flex-shrink:0;animation:newpulse 2s infinite;
}
@keyframes newpulse{0%,100%{opacity:1}50%{opacity:.6}}
.nav-tab-admin{display:none}
.nav-tab-admin.admin-show{display:block}
.bnav-btn-admin{display:none}
.bnav-btn-admin.admin-show{display:flex}

/* admin review page */
#page-admin-review{overflow:hidden}
.review-pad{padding:16px;padding-bottom:calc(16px + var(--nav-h) + var(--sb));max-width:600px;margin:0 auto;width:100%}
.review-header{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.review-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.review-cnt{font-size:12px;color:var(--tx3)}
.review-card{
  background:var(--sur);border:1.5px solid rgba(255,92,92,.3);
  border-radius:var(--r);padding:14px 16px;margin-bottom:10px;
  position:relative;
}
.review-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.review-card-text{font-size:13px;font-weight:600;color:var(--tx);flex:1;min-width:0}
.review-card-meta{font-size:11px;color:var(--tx3);margin-bottom:10px;line-height:1.7}
.review-actions{display:flex;gap:7px;flex-wrap:wrap}
.rv-btn{
  font-size:11px;font-weight:700;border-radius:6px;
  padding:5px 12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  border:none;transition:all .15s;
}
.rv-btn-approve{background:rgba(79,127,255,.15);color:var(--acc);border:1px solid rgba(79,127,255,.3)}
.rv-btn-approve:hover{background:rgba(79,127,255,.25)}
.rv-btn-start{background:rgba(72,199,142,.12);color:var(--ok);border:1px solid rgba(72,199,142,.25)}
.rv-btn-start:hover{background:rgba(72,199,142,.22)}
.rv-btn-del{background:rgba(255,92,92,.08);color:var(--err);border:1px solid rgba(255,92,92,.2)}
.rv-btn-del:hover{background:rgba(255,92,92,.18)}
.new-dot-nav{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--err);margin-left:4px;vertical-align:middle;
  animation:newpulse 2s infinite;
}

/* ── RECUR toggle & chip ── */
.tog-row{display:flex;gap:6px}
.tog-row .ptog{flex:1}
.rtog{flex:1;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx3);border-radius:var(--r2);padding:7px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.rtog.on{background:rgba(126,207,170,.1);border-color:#48c78e;color:#48c78e}
.dw-rtog{flex:1;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx3);border-radius:var(--r2);padding:9px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.dw-rtog.on{background:rgba(126,207,170,.1);border-color:#48c78e;color:#48c78e}
.recur-sel-wrap{display:flex;gap:6px;flex-wrap:wrap}
.recur-sel-wrap .p-sel,.recur-sel-wrap .p-inp{flex:1;min-width:70px}
.recur-chip{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;background:rgba(126,207,170,.12);color:#48c78e;border:1px solid rgba(126,207,170,.25);white-space:nowrap}
.dw-recur-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dw-recur-wrap .dw-sel{flex:1;min-width:70px}
/* today two-col for urgent+recur */
.today-dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(max-width:480px){.today-dual{grid-template-columns:1fr}}
.today-dual-sec{}
.today-dual-sec .tsec-title{margin-bottom:7px}

/* date input 개선 */
input[type="date"]{color-scheme:dark;min-width:0}
input[type="date"]::-webkit-inner-spin-button{display:none}
input[type="date"]::-webkit-calendar-picker-indicator{
  filter:invert(.7);cursor:pointer;opacity:.7;
}

/* today bottom 3-col grid */
.today-grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:6px;
}
@media(max-width:600px){.today-grid3{grid-template-columns:1fr}}
.today-grid3-col{}
.today-grid3-col .tsec-title{font-size:10px}
/* compact card for grid */
.ic-mini{
  display:flex;align-items:center;gap:7px;
  padding:6px 9px;border-radius:var(--r3);
  background:var(--sur);border:1px solid var(--bdr);
  cursor:pointer;transition:background .15s;margin-bottom:3px;
  -webkit-user-select:none;user-select:none;
}
.ic-mini:active{background:var(--sur2)}
@media(hover:hover){.ic-mini:hover{background:var(--sur2);border-color:var(--bdr2)}}
.ic-mini-text{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.ic-mini-meta{display:flex;align-items:center;gap:3px;flex-shrink:0}

/* ── DASHBOARD FILTER / SEARCH ── */
#dash-filter-bar{
  display:flex;align-items:center;gap:7px;
  padding:10px 13px;border-bottom:1px solid var(--bdr);
  flex-shrink:0;flex-wrap:wrap;background:var(--bg);
  position:sticky;top:0;z-index:5;
}
.search-wrap{
  flex:1;min-width:140px;position:relative;display:flex;align-items:center;
}
.search-ico{
  position:absolute;left:9px;font-size:13px;color:var(--tx3);pointer-events:none;
}
#dash-search{
  width:100%;background:var(--sur2);border:1.5px solid var(--bdr);
  color:var(--tx);border-radius:var(--r2);padding:7px 9px 7px 30px;
  font-family:'Noto Sans KR',sans-serif;font-size:12px;
  outline:none;transition:border-color .18s;-webkit-appearance:none;
}
#dash-search:focus{border-color:var(--acc)}
#dash-search::placeholder{color:var(--tx3)}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fchip{
  font-size:11px;font-weight:600;border-radius:20px;
  padding:4px 10px;cursor:pointer;border:1.5px solid var(--bdr2);
  background:var(--sur);color:var(--tx3);transition:all .13s;
  white-space:nowrap;
}
.fchip:hover{border-color:var(--bdr2);color:var(--tx2)}
.fchip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.fchip.on.fc-done{border-color:var(--ok);background:rgba(72,199,142,.1);color:var(--ok)}
.fchip.on.fc-none{border-color:var(--tx3);background:var(--sur3);color:var(--tx2)}
.fchip.on.fc-prio{border-color:var(--err);background:rgba(255,92,92,.1);color:var(--err)}
.fchip.on.fc-recur{border-color:#48c78e;background:rgba(72,199,142,.1);color:#48c78e}
.fchip.on.fc-new{border-color:var(--err);background:rgba(255,92,92,.1);color:var(--err)}
.filter-reset{
  background:none;border:none;color:var(--tx3);font-size:11px;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;padding:2px 5px;
  border-radius:4px;white-space:nowrap;
}
.filter-reset:hover{color:var(--err)}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="loading-text" id="load-txt">Firebase 연결 중...</div></div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">WORK<span>SPACE</span></div>
    <div class="login-sub">팀 업무 관리 · Firebase 실시간 동기화</div>
    <div class="l-lbl">아이디</div>
    <input class="l-inp" id="l-id" placeholder="아이디" autocomplete="username">
    <div class="l-lbl">비밀번호</div>
    <input class="l-inp" id="l-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <label class="l-rem"><input type="checkbox" id="l-rem" checked> 이 기기에서 자동 로그인</label>
    <button class="l-btn" id="l-btn">로그인</button>
    <div class="l-err" id="l-err"></div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="logo">WORK<span>SPACE</span></div>
    <div id="tb-date"></div>
    <div id="sync-dot" title="동기화"></div>
    <div class="user-pill">
      <div class="u-av" id="u-av"></div>
      <div class="u-nm" id="u-nm"></div>
      <div class="u-rl" id="u-rl"></div>
      <button class="logout-btn" onclick="doLogout()" title="로그아웃" style="font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--tx3)">OUT</button>
    </div>
  </div>
  <div id="pc-nav">
    <button class="nav-tab active" data-page="today">⚡ 투데이</button>

    <button class="nav-tab" data-page="project">🗂 프로젝트</button>
    <button class="nav-tab nav-tab-admin" data-page="admin-review" id="nav-admin-review">🔔 신규확인<span class="new-dot-nav" id="nav-new-dot" style="display:none"></span></button>
    <button class="nav-tab" data-page="account">👤 계정</button>
  </div>
  <div id="pages">
    <!-- TODAY -->
    <div class="page active" id="page-today">
      <div class="sa"><div class="today-pad">
        <div class="today-hdr"><div class="today-title">⚡ 투데이</div><div class="today-sub" id="today-sub"></div></div>
        <div class="today-sec"><div class="tsec-title">🔴 우선임무</div><div class="t-items" id="t-urgent"></div></div>
        <div class="today-sec"><div class="tsec-title">📋 진행 중 업무</div><div class="t-items" id="t-inprog"></div></div>
        <div class="today-grid3">
          <div class="today-grid3-col">
            <div class="tsec-title">🔧 이슈</div>
            <div id="t-issue"></div>
          </div>
          <div class="today-grid3-col">
            <div class="tsec-title">💡 아이디어</div>
            <div id="t-idea"></div>
          </div>
          <div class="today-grid3-col">
            <div class="tsec-title">🛒 필요물품</div>
            <div id="t-supply"></div>
          </div>
        </div>
      </div></div>
    </div>
    <!-- DASH -->
    <div class="page" id="page-dash">
      <div id="dash-main">
        <!-- 필터/검색 바 -->
        <div id="dash-filter-bar">
          <div class="search-wrap">
            <span class="search-ico">🔍</span>
            <input id="dash-search" placeholder="제목 검색..." oninput="onDashSearch(this.value)">
          </div>
          <div class="filter-chips" id="filter-chips"></div>
          <button class="filter-reset" id="filter-reset-btn" onclick="resetFilters()" style="display:none">✕ 초기화</button>
        </div>
        <div class="sa"><div class="dash-pad">
          <div class="group-row" id="group-row"></div>
          <div id="ctx-bar"><span style="font-size:10px;font-weight:700;color:var(--tx3)">카테고리</span><div id="ctx-chips"></div><button class="ctx-rst" onclick="resetCtx()">✕ 전체</button></div>
          <div class="list-hdr"><div class="list-lbl" id="list-lbl">전체</div><div class="list-cnt" id="list-cnt"></div></div>
          <div id="item-list"></div>
        </div></div>
      </div>
      <div id="inp-panel">
        <div class="ph"><div class="ph-title">+ 항목 추가</div><div class="ph-sub">유형 선택 후 입력</div></div>
        <div class="pb" id="pc-form"></div>
      </div>
    </div>
    <!-- PROJECT -->
    <div class="page" id="page-project">
      <div class="sa"><div class="proj-pad">
        <div class="proj-topbar"><div class="proj-title">🗂 프로젝트</div><button class="proj-add-btn" onclick="openPM()">+ 프로젝트 추가</button></div>
        <div class="proj-grid" id="proj-grid"></div>
      </div></div>
    </div>
    <!-- ACCOUNT -->
    <div class="page" id="page-account">
      <div class="sa"><div class="acct-pad" id="acct-content"></div></div>
    </div>
    <!-- ADMIN REVIEW -->
    <div class="page" id="page-admin-review">
      <div class="sa"><div class="review-pad" id="review-content"></div></div>
    </div>
  </div>
  <div id="bnav">
    <button class="bnav-btn active" data-bnav="today"><div class="bnav-ico">⚡</div><div class="bnav-lbl">투데이</div></button>
    <button class="bnav-btn" data-bnav="dash"><div class="bnav-ico">📋</div><div class="bnav-lbl">대시보드</div></button>
    <button class="bnav-btn" data-bnav="project"><div class="bnav-ico">🗂</div><div class="bnav-lbl">프로젝트</div></button>
    <button class="bnav-btn bnav-btn-admin" data-bnav="admin-review" id="bnav-admin-review"><div class="bnav-ico">🔔<span class="new-dot-nav" id="bnav-new-dot" style="display:none;width:5px;height:5px;margin-left:1px"></span></div><div class="bnav-lbl">신규</div></button>
    <button class="bnav-btn" data-bnav="account"><div class="bnav-ico">👤</div><div class="bnav-lbl">계정</div></button>
    <button class="bnav-btn" data-bnav="add"><div class="bnav-ico">✦</div><div class="bnav-lbl">추가</div></button>

</div>

<div id="inp-sheet">
  <div id="inp-sheet-bg" onclick="closeSheet()"></div>
  <div id="inp-sheet-body">

    <div class="sheet-scroll" id="sh-form"></div>
  </div>
</div>

<div id="dov" onclick="closeDW()"></div>

<!-- Firebase via ES module -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyB6jns6vqqXkh63HF8JyopOPQggM3itKS0",
  authDomain:"remplir-workspace-pilot-92963.firebaseapp.com",
  databaseURL:"https://remplir-workspace-pilot-92963-default-rtdb.firebaseio.com",
  projectId:"remplir-workspace-pilot-92963",
  storageBucket:"remplir-workspace-pilot-92963.firebasestorage.app",
  messagingSenderId:"375235736390",
  appId:"1:375235736390:web:4b62924e5c0e138465ab47"
};

try {
  const app = initializeApp(cfg);
  const db  = getDatabase(app);

  window._fb = {
    refFn: (p) => ref(db, p),
    makeRef: (path) => {
      const r = ref(db, path);
      let unsub = null;
      return {
        on: (evt, cb, errCb) => {
          unsub = onValue(r, cb, errCb || (() => {}));
        },
        off: () => { if(unsub) unsub(); }
      };
    },
    setVal: (path, data) => set(ref(db, path), data),
    delVal: (path) => remove(ref(db, path))
  };
} catch(err) {
  console.error("Firebase init error:", err);
}

// ES module runs after defer — call onFbReady if already waiting
if(typeof window._onFbReady === 'function') {
  window._onFbReady();
} else {
  window._fbDone = true;
}
</script>

<script>
(function(){
'use strict';
var DAYS=['일','월','화','수','목','금','토'];
var CATS=['믹싱','코팅','프레싱','시설관리','부품구매','기타'];
var PROCS=['믹싱','코팅','프레싱','시설관리','부품구매','기타'];
var PSMETA={active:{l:'진행중',c:'ps-a'},hold:{l:'보류',c:'ps-h'},done:{l:'완료',c:'ps-d'}};
var PGMETA={none:{l:'시작 전',c:'pn'},ing:{l:'진행 중',c:'pi'},done:{l:'진행 완료',c:'pd'}};
var BYMETA={none:{l:'구매 전',c:'pbn'},ing:{l:'구매 확정',c:'pbi'},done:{l:'구매 완료',c:'pbd'}};
var DEFAULT_ACCOUNTS={admin:{pw:'ws2024',role:'admin'},user1:{pw:'pass1234',role:'user'}};

var items={}, projects={}, accounts=DEFAULT_ACCOUNTS;
var curPage='today', curGroup=null, curCat=null;
var dwItemKey=null, dwProjKey=null;
var cu=null; // currentUser
var unsubs=[];

/* utils */
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isAdmin(){return cu&&cu.role==='admin';}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function dday(s){if(!s)return null;var d=new Date(s);d.setHours(0,0,0,0);return Math.round((d-today0())/86400000);}
function fmtTs(ts){var d=new Date(ts);return(d.getMonth()+1)+'/'+d.getDate()+' ('+DAYS[d.getDay()]+')';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}
function sync(s){var d=document.getElementById('sync-dot');if(!d)return;d.className=s||'';}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function renderTopDate(){var d=new Date();var el=document.getElementById('tb-date');if(el)el.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';}

/* fb write */
function fbSet(path,data){
  if(!window._fb){console.warn('FB not ready');return;}
  sync('syncing');
  window._fb.setVal(path,data)
    .then(function(){sync('');})
    .catch(function(err){console.error(err);sync('err');toast('저장 실패');});
}
function fbDel(path){
  if(!window._fb){console.warn('FB not ready');return;}
  sync('syncing');
  window._fb.delVal(path)
    .then(function(){sync('');})
    .catch(function(){sync('err');});
}

/* auth */
function doLogin(){
  var id=(document.getElementById('l-id').value||'').trim();
  var pw=document.getElementById('l-pw').value||'';
  var rem=document.getElementById('l-rem').checked;
  var err=document.getElementById('l-err');
  if(!id||!pw){if(err)err.textContent='아이디와 비밀번호를 입력해주세요.';return;}
  var a=Object.keys(accounts).length?accounts:DEFAULT_ACCOUNTS;
  if(!a[id]||a[id].pw!==pw){if(err)err.textContent='아이디 또는 비밀번호가 틀렸습니다.';document.getElementById('l-pw').value='';return;}
  cu={id:id,role:a[id].role};
  if(rem)lsSet('ws2-sess',cu); else lsDel('ws2-sess');
  startApp();
}
window.doLogout=function(){
  lsDel('ws2-sess');cu=null;
  unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];
  items={};projects={};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('l-id').value='';document.getElementById('l-pw').value='';
  var er=document.getElementById('l-err');if(er)er.textContent='';
};

/* firebase subscribe */
function subscribe(){
  var fb=window._fb;
  if(!fb){ console.warn('Firebase not ready'); return; }
  sync('syncing');

  var r1=fb.makeRef('accounts');
  r1.on('value',function(s){var v=s.val();if(v)accounts=v;});
  unsubs.push(function(){ r1.off(); });

  var r2=fb.makeRef('items');
  r2.on('value',function(s){items=s.val()||{};sync('');renderAll();},function(){sync('err');});
  unsubs.push(function(){ r2.off(); });

  var r3=fb.makeRef('projects');
  r3.on('value',function(s){projects=s.val()||{};if(curPage==='project')renderProjects();updateProjSel();});
  unsubs.push(function(){ r3.off(); });
}

function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  var av=document.getElementById('u-av');if(av)av.textContent=cu.id[0].toUpperCase();
  var nm=document.getElementById('u-nm');if(nm)nm.textContent=cu.id;
  var rl=document.getElementById('u-rl');if(rl)rl.textContent=isAdmin()?'관리자':'팀원';
  buildForm('pc-form',false);
  subscribe();
  renderTopDate();setInterval(renderTopDate,60000);
  updateAdminUI();
  updateLayout();
  window.addEventListener('resize',updateLayout);
  showPage('today');
}

function updateLayout(){
  var isMobile=window.innerWidth<=768;
  var pcNav=document.getElementById('pc-nav');
  var bnav=document.getElementById('bnav');
  var panel=document.getElementById('inp-panel');
  var fab=document.getElementById('fab');
  var sheet=document.getElementById('inp-sheet');
  if(pcNav) pcNav.style.display=isMobile?'none':'flex';
  if(bnav)  bnav.style.display=isMobile?'flex':'none';
  if(panel) panel.style.display=isMobile?'none':'flex';
  if(fab)   fab.style.display=isMobile?'flex':'none';
  if(sheet &&!document.getElementById('inp-sheet').classList.contains('open'))
    sheet.style.display=isMobile?'flex':'none';
}

/* page */
function showPage(p){
  curPage=p;
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.toggle('active',t.dataset.page===p);});
  document.querySelectorAll('.page').forEach(function(el){el.classList.toggle('active',el.id==='page-'+p);});
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.bnav===p);});
  if(p==='today')renderToday();
  if(p==='dash')render();
  if(p==='project')renderProjects();
  if(p==='account')renderAccount();
  if(p==='admin-review')renderAdminReview();
}
window.showPage=showPage;
function renderAll(){if(curPage==='today')renderToday();if(curPage==='dash')render();if(curPage==='admin-review')renderAdminReview();updateNewDot();}

/* ── admin-only UI visibility ── */
function updateAdminUI(){
  var show=isAdmin();
  document.querySelectorAll('.nav-tab-admin').forEach(function(el){el.classList.toggle('admin-show',show);});
  document.querySelectorAll('.bnav-btn-admin').forEach(function(el){el.classList.toggle('admin-show',show);});
}
function updateNewDot(){
  var hasNew=isAdmin()&&Object.values(items).some(function(x){return x.isNew;});
  ['nav-new-dot','bnav-new-dot'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.style.display=hasNew?'inline-block':'none';
  });
}

/* ═══ ADMIN REVIEW PAGE ═══ */
function renderAdminReview(){
  var el=document.getElementById('review-content');if(!el)return;
  var newItems=arr().filter(function(x){return x.isNew;})
    .sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  var tl={task:'업무',issue:'이슈',idea:'아이디어',supply:'필요물품'};
  if(!newItems.length){
    el.innerHTML='<div class="review-header"><div class="review-title">🔔 신규 확인</div></div>'
      +'<div class="empty" style="padding:48px 0"><div class="empty-icon">✅</div><div class="empty-text">확인할 신규 항목이 없습니다</div></div>';
    return;
  }
  var cards=newItems.map(function(item){
    var prog=item.type==='supply'?BUY_META:PGMETA;
    var pm=prog[item.progress||'none']||prog.none;
    var catTag=item.cat?'<span class="cat-tag">'+e(item.cat)+'</span>':'';
    var typeTag='<span class="cat-tag" style="color:var(--tx2)">'+e(tl[item.type]||item.type)+'</span>';
    var dd=dday(item.dueDate);
    var dueTag=item.dueDate?'<span style="font-size:11px;color:var(--tx3)">📅 '+e(item.dueDate)+(dd!==null&&dd<=7?' <span style="color:var(--err)">(D-'+dd+')</span>':'')+'</span>':'';
    var timeAgo=Math.round((Date.now()-(item.ts||0))/3600000);
    var timeStr=timeAgo<1?'방금':timeAgo<24?timeAgo+'시간 전':Math.round(timeAgo/24)+'일 전';
    return '<div class="review-card">'
      +'<div class="review-card-top"><span class="new-badge">NEW</span>'+typeTag+catTag+'</div>'
      +'<div class="review-card-text">'+e(item.text)+'</div>'
      +'<div class="review-card-meta">👤 '+e(item.author||'?')+' · '+timeStr
      +(item.dueDate?'<br>'+dueTag:'')
      +'<br><span class="prog '+pm.c+'">'+pm.l+'</span></div>'
      +'<div class="review-actions">'
      +'<button class="rv-btn rv-btn-approve" onclick="rvConfirm(\''+item._k+'\')">✓ 확인</button>'
      +'<button class="rv-btn rv-btn-start" onclick="rvStartItem(\''+item._k+'\')">▶ 진행중으로</button>'
      +'<button class="rv-btn" onclick="openDW(\''+item._k+'\')" style="background:var(--sur2);color:var(--tx2);border:1px solid var(--bdr2)">상세보기</button>'
      +(isAdmin()?'<button class="rv-btn rv-btn-del" onclick="rvDeleteItem(\''+item._k+'\')">삭제</button>':'')
      +'</div>'
      +'</div>';
  }).join('');
  el.innerHTML='<div class="review-header"><div class="review-title">🔔 신규 확인</div><div class="review-cnt">'+newItems.length+'개 대기</div></div>'+cards;
}

window.rvConfirm=function(key){
  var item=getItm(key);if(!item)return;
  item.isNew=false;delete item._k;
  items[key]=item;fbSet('items/'+key,item);
  updateNewDot();renderAdminReview();
  toast('확인 처리됨');
};
window.rvStartItem=function(key){
  var item=getItm(key);if(!item)return;
  item.isNew=false;item.progress='ing';delete item._k;
  items[key]=item;fbSet('items/'+key,item);
  updateNewDot();renderAdminReview();render();
  toast('진행중으로 변경됨');
};
window.rvDeleteItem=function(key){
  if(!confirm('항목을 삭제하시겠습니까?'))return;
  delete items[key];fbDel('items/'+key);
  updateNewDot();renderAdminReview();render();
  toast('삭제됨');
};

/* ═══ DASHBOARD FILTER / SEARCH ═══ */
var dashSearch = '';
var activeFilters = {}; // key: filter id, value: true/false

var FILTER_DEFS = [
  { id:'none',  label:'시작 전',  cls:'fc-none',  test:function(x){return (x.progress||'none')==='none';} },
  { id:'ing',   label:'진행 중',  cls:'fc-ing',   test:function(x){return x.progress==='ing';} },
  { id:'done',  label:'완료',    cls:'fc-done',  test:function(x){return x.progress==='done';} },
  { id:'prio',  label:'🔴 우선', cls:'fc-prio',  test:function(x){return x.priority==='high';} },
  { id:'recur', label:'🔁 주기', cls:'fc-recur', test:function(x){return !!x.recur;} },
  { id:'new',   label:'NEW',     cls:'fc-new',   test:function(x){return !!x.isNew;}, adminOnly:true },
];

function buildFilterChips(){
  var el=document.getElementById('filter-chips'); if(!el) return;
  el.innerHTML=FILTER_DEFS.filter(function(f){return !f.adminOnly||isAdmin();}).map(function(f){
    var on=activeFilters[f.id];
    return'<div class="fchip'+(on?' on '+f.cls:'')+'" data-fid="'+f.id+'">'+f.label+'</div>';
  }).join('');
  el.querySelectorAll('.fchip').forEach(function(chip){
    chip.addEventListener('click',function(){
      var fid=this.dataset.fid;
      activeFilters[fid]=!activeFilters[fid];
      buildFilterChips();
      updateFilterResetBtn();
      renderList();
    });
  });
}

function updateFilterResetBtn(){
  var btn=document.getElementById('filter-reset-btn');if(!btn)return;
  var anyOn=Object.values(activeFilters).some(Boolean)||dashSearch;
  btn.style.display=anyOn?'':'none';
}

window.onDashSearch=function(val){
  dashSearch=val.trim().toLowerCase();
  updateFilterResetBtn();
  renderList();
};

window.resetFilters=function(){
  activeFilters={};dashSearch='';
  var si=document.getElementById('dash-search');if(si)si.value='';
  buildFilterChips();
  updateFilterResetBtn();
  renderList();
};
function renderAccount(){

    // 관리자: 전체 계정 목록 + 삭제 + 새 계정 추가

      return'<div class="acct-row"><div style="flex:1"><div class="acct-id">'+e(id)+'</div>'+rn+'</div>'+rb+del+'</div>';
    }).join('');

    el.innerHTML=
      '<div class="acct-sec-title">👤 계정 관리</div>'

      +'<div class="acct-card">'
      +'<div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:12px">새 계정 추가</div>'
      +'<div class="add-acct-form">'
      +'<div class="form-row"><input class="dw-inp" id="na-id" placeholder="아이디"><input class="dw-inp" id="na-realname" placeholder="실명 (필수)"></div>'
      +'<input class="dw-inp" id="na-pw" type="password" placeholder="비밀번호">'
      +'<select class="dw-sel" id="na-role"><option value="user">팀원</option><option value="admin">관리자</option></select>'
      +'<div class="form-err" id="na-err"></div>'
      +'<button class="acct-submit" onclick="adminAddAcct()">계정 추가</button>'
      +'</div></div>';
  } else {
    // 일반 사용자: 내 정보 + 아이디/비번/실명 수정
    var a=accounts[cu.id]||{};
    el.innerHTML=
      '<div class="acct-sec-title">👤 내 계정</div>'
      +'<div class="my-info-card">'
      +'<div class="my-info-label">아이디</div><div class="my-info-val">'+e(cu.id)+'</div>'
      +(a.realname?'<div class="my-info-sub">실명: '+e(a.realname)+'</div>':'<div class="my-info-sub" style="color:var(--err)">⚠ 실명을 등록해주세요</div>')
      +'</div>'
      +'<div class="acct-card">'
      +'<div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:12px">정보 수정</div>'
      +'<div class="pw-form">'
      +'<div><div class="dw-lbl">실명 <span style="color:var(--err)">*</span></div><input class="dw-inp" id="my-realname" placeholder="실명 입력" value="'+e(a.realname||'')+'"></div>'
      +'<div><div class="dw-lbl">새 아이디 <span style="color:var(--tx3);font-size:10px">(변경 시 입력)</span></div><input class="dw-inp" id="my-newid" placeholder="새 아이디 입력 (현재: '+e(cu.id)+')" autocomplete="off"></div>'
      +'<div><div class="dw-lbl">현재 비밀번호 <span style="color:var(--err)">*</span></div><input class="dw-inp" type="password" id="my-pw-cur" placeholder="현재 비밀번호 (필수)"></div>'
      +'<div><div class="dw-lbl">새 비밀번호 <span style="color:var(--tx3);font-size:10px">(변경 시 입력)</span></div><input class="dw-inp" type="password" id="my-pw-new" placeholder="새 비밀번호"></div>'
      +'<div><div class="dw-lbl">새 비밀번호 확인</div><input class="dw-inp" type="password" id="my-pw-new2" placeholder="새 비밀번호 확인"></div>'
      +'<div class="form-err" id="my-err"></div>'
      +'<div class="form-ok" id="my-ok"></div>'
      +'<button class="acct-submit" onclick="myUpdateInfo()">저장</button>'
      +'</div></div>';

window.adminDelAcct=function(id){
  if(!confirm(id+' 계정을 삭제하시겠습니까?'))return;
  var a=Object.assign({},accounts);
  delete a[id];
  fbSet('accounts',a);
  accounts=a;
  renderAccount();
  toast('계정 삭제됨');
};

window.adminAddAcct=function(){
  var id=(document.getElementById('na-id').value||'').trim();
  var rn=(document.getElementById('na-realname').value||'').trim();
  var pw=document.getElementById('na-pw').value||'';
  var role=document.getElementById('na-role').value;
  var err=document.getElementById('na-err');
  if(!id){if(err)err.textContent='아이디를 입력해주세요.';return;}
  if(!rn){if(err)err.textContent='실명을 입력해주세요.';return;}
  if(!pw||pw.length<4){if(err)err.textContent='비밀번호는 4자 이상이어야 합니다.';return;}
  if(accounts[id]){if(err)err.textContent='이미 존재하는 아이디입니다.';return;}
  var a=Object.assign({},accounts);
  a[id]={pw:pw,role:role,realname:rn};
  fbSet('accounts',a);
  accounts=a;
  ['na-id','na-realname','na-pw'].forEach(function(i){var el=document.getElementById(i);if(el)el.value='';});
  if(err)err.textContent='';
  renderAccount();
  toast('✓ 계정이 추가됐습니다.');
};

window.myUpdateInfo=function(){
  var rn=(document.getElementById('my-realname').value||'').trim();
  var newId=(document.getElementById('my-newid').value||'').trim();
  var curPw=document.getElementById('my-pw-cur').value||'';
  var newPw=document.getElementById('my-pw-new').value||'';
  var newPw2=document.getElementById('my-pw-new2').value||'';
  var err=document.getElementById('my-err');
  var ok=document.getElementById('my-ok');
  if(err)err.textContent='';if(ok)ok.textContent='';

  if(!rn){if(err)err.textContent='실명을 입력해주세요.';return;}

  // 아이디 또는 비밀번호 변경 시 현재 비밀번호 필수
  var needsVerify=newId||newPw||newPw2;
  if(needsVerify){
    var a2=Object.assign({},accounts);
    var myAcct2=a2[cu.id]||{};
    if(!curPw){if(err)err.textContent='변경 시 현재 비밀번호를 입력해주세요.';return;}
    if(myAcct2.pw!==curPw){if(err)err.textContent='현재 비밀번호가 틀렸습니다.';return;}
  }

  var a=Object.assign({},accounts);
  var myAcct=Object.assign({},a[cu.id]||{});
  myAcct.realname=rn;

  // 비밀번호 변경
  if(newPw||newPw2){
    if(!newPw||newPw.length<4){if(err)err.textContent='새 비밀번호는 4자 이상이어야 합니다.';return;}
    if(newPw!==newPw2){if(err)err.textContent='새 비밀번호가 일치하지 않습니다.';return;}
    myAcct.pw=newPw;
  }

  // 아이디 변경
  if(newId && newId!==cu.id){
    if(a[newId]){if(err)err.textContent='이미 사용 중인 아이디입니다.';return;}
    if(newId.length<2){if(err)err.textContent='아이디는 2자 이상이어야 합니다.';return;}
    a[newId]=myAcct;
    delete a[cu.id];
    fbSet('accounts',a);
    accounts=a;
    // 세션 업데이트
    cu.id=newId;
    lsSet('ws2-sess',cu);
    var nm=document.getElementById('u-nm');if(nm)nm.textContent=newId;
    var av=document.getElementById('u-av');if(av)av.textContent=newId[0].toUpperCase();
  } else {
    a[cu.id]=myAcct;
    fbSet('accounts',a);
    accounts=a;
    lsSet('ws2-sess',cu);
  }

  ['my-pw-cur','my-pw-new','my-pw-new2','my-newid'].forEach(function(i){var el=document.getElementById(i);if(el)el.value='';});
  if(ok)ok.textContent='✓ 저장됐습니다.';
  toast('✓ 정보가 업데이트됐습니다.');
  // 아이디 변경됐으면 페이지 리렌더
  if(newId&&newId!==cu.id) renderAccount();
};

/* today */
/* 주기 업무 활성화 여부 판단 */
function recurLabel(item){
  if(!item.recurUnit) return '';
  var u=item.recurUnit;
  if(u==='day') return '매일';
  if(u==='week'){
    var wi=parseInt((item.recurVal||'w0').replace('w',''))||0;
    return '매주 '+(WEEK_OPTS[wi]||'');
  }
  if(u==='month'){
    var mode=item.recurVal||'mode-date';
    if(mode==='mode-week'){
      var nwi=parseInt((item.recurVal2||'nw0').replace('nw',''))||0;
      return '매월 '+(MONTH_WEEK_OPTS[nwi]?MONTH_WEEK_OPTS[nwi].label:'');
    } else {
      var di=parseInt((item.recurVal2||'d0').replace('d',''))||0;
      return '매월 '+(MONTH_OPTS[di]||'');
    }
  }
  return '';
}

function isRecurActive(item){
  if(!item.recur||!item.recurUnit) return false;
  var now=new Date();
  var u=item.recurUnit;
  if(u==='day') return true;
  if(u==='week'){
    var wi=parseInt((item.recurVal||'w0').replace('w',''))||0;
    var jsDay=[1,2,3,4,5,6,0][wi];
    return now.getDay()===jsDay;
  }
  if(u==='month'){
    var mode=item.recurVal||'mode-date';
    if(mode==='mode-week'){
      var nwi=parseInt((item.recurVal2||'nw0').replace('nw',''))||0;
      var mwo=MONTH_WEEK_OPTS[nwi];
      if(!mwo) return false;
      var jsDay2=[1,2,3,4,5,6,0][mwo.d];
      if(now.getDay()!==jsDay2) return false;
      var date=now.getDate();
      if(mwo.n===4){
        var nw=new Date(now); nw.setDate(date+7);
        return nw.getMonth()!==now.getMonth();
      }
      return Math.floor((date-1)/7)===mwo.n;
    } else {
      var di2=parseInt((item.recurVal2||'d0').replace('d',''))||0;
      var dt=now.getDate();
      var last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
      if(di2===28) return dt===last;
      return dt===(di2+1);
    }
  }
  return false;
}

function renderToday(){
  var d=new Date();var sub=document.getElementById('today-sub');
  if(sub)sub.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';
  var a=arr();

  // 우선임무: high priority 항목만 (완료 제외)
  var urgent=a.filter(function(x){
    return x.progress!=='done' && x.priority==='high';
  });

  // 진행 중 업무: 진행중 상태 업무 (주기 업무 제외 - 별도 섹션)
  var inpAll=a.filter(function(x){
    if(x.type!=='task') return false;
    if(x.recur) return false; // 주기 업무는 주기적 섹션으로
    return x.progress==='ing';
  });
  var inpNear=inpAll.filter(function(x){
    var dd=dday(x.dueDate); return dd!==null&&dd<=7;
  }).sort(function(a,b){
    return new Date(a.dueDate)-new Date(b.dueDate);
  });
  var inpRest=inpAll.filter(function(x){
    var dd=dday(x.dueDate); return dd===null||dd>7;
  }).sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
  var inp=inpNear.concat(inpRest);

  function makeCard(item){
    var isNear=item.dueDate&&dday(item.dueDate)<=7;
    var ex=isNear?'<span style="font-size:12px;margin-right:2px">📅</span>':'';
    return cardHtml(item,ex);
  }
  function setList(id,arr,em){
    var el=document.getElementById(id);if(!el)return;
    if(!arr.length){el.innerHTML='<div class="empty" style="padding:10px 0"><div class="empty-text" style="font-size:11px">'+em+'</div></div>';return;}
    el.innerHTML=arr.map(makeCard).join('');
    bindCards(el);
  }
  setList('t-urgent',urgent,'우선임무 없음');
  setList('t-inprog',inp,'진행 중 업무 없음');

  // ── 하단 3열: 이슈 / 아이디어 / 필요물품 (완료 제외, 최신순)
  function miniCardHtml(item){
    var dc={task:'dot-t',issue:'dot-i',idea:'dot-d',supply:'dot-s'}[item.type]||'dot-t';
    var pm=item.type==='supply'?BUY_META:PGMETA;
    var prog=pm[item.progress||'none']||pm.none;
    var isDone=item.progress==='done';
    var newBadge=(item.isNew&&isAdmin())?'<span class="new-badge" style="font-size:8px;padding:1px 4px">N</span>':'';
    return'<div class="ic-mini'+(isDone?' ic-done':'')+'" data-k="'+item._k+'">'
      +'<div class="ic-dot '+dc+'" style="width:6px;height:6px"></div>'
      +'<div class="ic-mini-text">'+e(item.text)+'</div>'
      +'<div class="ic-mini-meta">'+newBadge+'<span class="prog '+prog.c+'" style="font-size:9px;padding:1px 4px">'+prog.l+'</span></div>'
      +'</div>';
  }
  function setMiniList(id,type){
    var el=document.getElementById(id);if(!el)return;
    var list=a.filter(function(x){return x.type===type&&(x.progress||'none')!=='done';})
      .sort(function(a,b){return(b.ts||0)-(a.ts||0);});
    if(!list.length){
      el.innerHTML='<div style="font-size:11px;color:var(--tx3);padding:6px 0">없음</div>';
      return;
    }
    el.innerHTML=list.map(miniCardHtml).join('');
    el.querySelectorAll('.ic-mini').forEach(function(c){
      c.addEventListener('click',function(){openDW(this.dataset.k);});
    });
  }
  setMiniList('t-issue','issue');
  setMiniList('t-idea','idea');
  setMiniList('t-supply','supply');
}

function renderList(){

  // 텍스트 검색

        ||(x.detail||'').toLowerCase().indexOf(dashSearch)>-1;
  });

  // 필터 칩 (모두 AND 조건)
  if(Object.values(activeFilters).some(Boolean)){

    a=a.filter(function(x){return activeDefs.every(function(f){return f.test(x);});});
  }

  a.sort(function(a,b){
    var ad=a.progress==='done'?1:0,bd=b.progress==='done'?1:0;if(ad!==bd)return ad-bd;
    // 관리자: NEW 항목 맨 위
    if(isAdmin()){var an=a.isNew?0:1,bn=b.isNew?0:1;if(an!==bn)return an-bn;}
    var ap=a.priority==='high'?0:1,bp=b.priority==='high'?0:1;if(ap!==bp)return ap-bp;
    if(a.dueDate&&b.dueDate)return new Date(a.dueDate)-new Date(b.dueDate);
    if(a.dueDate)return-1;if(b.dueDate)return 1;
    return(b.ts||0)-(a.ts||0);

  var el=document.getElementById('item-list');if(!el)return;

}

var MONTH_OPTS=['1일','2일','3일','4일','5일','6일','7일','8일','9일','10일','11일','12일','13일','14일','15일','16일','17일','18일','19일','20일','21일','22일','23일','24일','25일','26일','27일','28일','말일'];
// 매월 N째주 요일 옵션
var MONTH_WEEK_OPTS=[];
['첫째','둘째','셋째','넷째','마지막'].forEach(function(nth,ni){
  ['월','화','수','목','금','토','일'].forEach(function(day,di){

window.onRunitChange=function(p){

};

  var recurVal=isRecur?(rvalEl?rvalEl.value||'':''):'';

  var k=uid();
  var item={
    type:type,
    cat:isSup?'':(catEl?catEl.value||'':''),
    text:title,
    detail:detail,
    dueDate:(!isRecur&&dueEl?dueEl.value||'':''),
    priority:prioEl&&prioEl.classList.contains('hi')?'high':'normal',
    recur:isRecur,recurUnit:recurUnit,recurVal:recurVal,recurVal2:recurVal2,
    progress:(progEl?progEl.value||'none':'none'),
    projKey:(projEl?projEl.value||'':''),
    ts:Date.now(),author:cu?cu.id:'?',
    isNew:(!isAdmin()?true:false),
    comments:{}
  };
  items[k]=item;fbSet('items/'+k,item);
  var titleEl=document.getElementById(p+'-title');if(titleEl)titleEl.value='';
  document.getElementById(p+'-txt').value='';
  if(dueEl)dueEl.value='';
  if(prioEl){prioEl.classList.remove('hi');prioEl.textContent='우선 아님';}
  if(progEl)progEl.value='none';
  if(projEl)projEl.value='';
  if(catEl)catEl.value='';
  // reset recur toggle
  var rb=document.getElementById(p+'-recur');
  if(rb){rb.classList.remove('on');rb.textContent='🔁 주기 아님';}
  var dw2=document.getElementById(p+'-due-wrap');if(dw2)dw2.style.display='';
  var rw=document.getElementById(p+'-recur-wrap');if(rw)rw.style.display='none';
  render();renderToday();toast('✓ 추가됨');if(p==='sh')closeSheet();
};

window.dwTogP=function(){var b=document.getElementById('dw-ptog');if(!b)return;var h=b.classList.contains('hi');b.classList.toggle('hi',!h);b.textContent=h?'우선 아님':'🔴 우선';};

window.dwTogRecur=function(){

window.dwRunitChange=function(forceUnit, forceVal){
  var unit=forceUnit||(document.getElementById('dw-runit')||{}).value||'week';
  var rval=document.getElementById('dw-rval'); if(!rval) return;
  if(unit==='day'){rval.style.display='none';rval.innerHTML='';}
  else if(unit==='week'){
    rval.style.display='';
    rval.innerHTML=WEEK_OPTS.map(function(o,i){return'<option value="w'+i+'"'+(forceVal==='w'+i?' selected':'')+'>'+o+'</option>';}).join('');
  }
  else if(unit==='month'){
    rval.style.display='';
    rval.innerHTML='<option value="mode-date">날짜 지정 (며칠)</option><option value="mode-week">N째주 요일 지정</option>';
    // rval2 셀렉트
    var wrap=document.getElementById('dw-rval2-wrap')||null;
    if(!wrap){
      wrap=document.createElement('div');wrap.id='dw-rval2-wrap';wrap.className='dw-recur-wrap';
      rval.parentNode.appendChild(wrap);
    }
    var sel2=document.getElementById('dw-rval2');
    if(!sel2){sel2=document.createElement('select');sel2.id='dw-rval2';sel2.className='dw-sel';wrap.appendChild(sel2);}
    wrap.style.display='flex';
    // 기본 날짜 모드
    sel2.innerHTML=MONTH_OPTS.map(function(o,i){return'<option value="d'+i+'">'+o+'</option>';}).join('');
    rval.onchange=function(){
      if(this.value==='mode-week'){
        sel2.innerHTML=MONTH_WEEK_OPTS.map(function(o,i){return'<option value="nw'+i+'">'+o.label+'</option>';}).join('');
      } else {
        sel2.innerHTML=MONTH_OPTS.map(function(o,i){return'<option value="d'+i+'">'+o+'</option>';}).join('');
      }
    };
  }
};

window.saveItem=function(){
  var item=getItm(dwItemKey);if(!item)return;
  var titleEl=document.getElementById('dw-item-title');
  var detailEl=document.getElementById('dw-txt');
  var title=(titleEl?titleEl.value||'':item.text).trim();
  if(!title){toast('제목을 입력해주세요.');return;}
  item.text=title;
  item.detail=(detailEl?detailEl.value||'':'').trim();
  var ce=document.getElementById('dw-cat');if(ce)item.cat=ce.value||'';
  var pb=document.getElementById('dw-ptog');if(pb)item.priority=pb.classList.contains('hi')?'high':'normal';
  // 주기 토글 상태 (관리자)
  if(isAdmin()){
    var rtog=document.getElementById('dw-rtog');
    if(rtog){
      var newRecur=rtog.classList.contains('on');
      item.recur=newRecur;
      if(newRecur){
        var ru=document.getElementById('dw-runit');if(ru)item.recurUnit=ru.value;
        var rv=document.getElementById('dw-rval');if(rv)item.recurVal=rv.value;
        var rv2=document.getElementById('dw-rval2');item.recurVal2=rv2?rv2.value:'';
        item.dueDate='';
      } else {
        item.recurUnit='';item.recurVal='';item.recurVal2='';
      }
    }
  }
  var de=document.getElementById('dw-due');if(de&&!item.recur)item.dueDate=de.value||'';
  if(isAdmin()){
    var pg=document.getElementById('dw-prog');
    if(pg){item.progress=pg.value;if(pg.value==='ing'||pg.value==='done')item.isNew=false;}
  }
  var pe=document.getElementById('dw-proj');if(pe&&pe.value)item.projKey=pe.value;
  delete item._k;items[dwItemKey]=item;fbSet('items/'+dwItemKey,item);
  closeDW();render();renderToday();toast('저장됨');
};
window.unlinkP=function(){var item=getItm(dwItemKey);if(!item)return;item.projKey='';delete item._k;items[dwItemKey]=item;fbSet('items/'+dwItemKey,item);openDW(dwItemKey);};
window.delItem=function(){if(!confirm('항목을 삭제하시겠습니까?'))return;delete items[dwItemKey];fbDel('items/'+dwItemKey);closeDW();render();renderToday();toast('삭제됨');};

/* projects */
function renderProjects(){
  var el=document.getElementById('proj-grid');if(!el)return;
  var arr2=Object.entries(projects);
  if(!arr2.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🗂</div><div class="empty-text">프로젝트를 추가해보세요</div></div>';return;}
  el.innerHTML=arr2.map(function(ent){
    var k=ent[0],p=ent[1];var sm=PSMETA[p.status||'active']||PSMETA.active;
    var mem=p.members&&p.members.length?'<span>👥 '+p.members.map(function(m){return e(m.name);}).join(', ')+'</span>':'';
    var pg=p.procGoals||{};var sp=PROCS.filter(function(pr){return pg[pr]&&pg[pr].trim();});var ph=sp.length?'<span>🏭 '+sp.join(' · ')+'</span>':'';
    return'<div class="proj-card" data-pk="'+k+'"><div class="pc-top"><div class="pc-ico" style="background:'+(p.color||'var(--acc2)')+'">'+e(p.icon||'🏭')+'</div><div><div class="pc-name">'+e(p.name)+'</div><span class="ps-badge '+sm.c+'">'+sm.l+'</span></div></div>'+(p.desc?'<div class="pc-desc">'+e(p.desc)+'</div>':'')+'<div class="pc-meta">'+mem+ph+'</div></div>';
  }).join('');
  el.querySelectorAll('.proj-card').forEach(function(c){c.addEventListener('click',function(){openProjDW(this.dataset.pk);});});
}
function renderTimeline(projKey){
  // gather items linked to this project, sorted by dueDate then ts
  var linked = Object.entries(items)
    .filter(function(e2){ return e2[1].projKey===projKey; })
    .map(function(e2){ return Object.assign({},e2[1],{_k:e2[0]}); })
    .sort(function(a,b){
      // done items go to bottom
      var ad=a.progress==='done'?1:0, bd=b.progress==='done'?1:0;
      if(ad!==bd) return ad-bd;
      if(a.dueDate&&b.dueDate) return new Date(a.dueDate)-new Date(b.dueDate);
      if(a.dueDate) return -1; if(b.dueDate) return 1;
      return (a.ts||0)-(b.ts||0);
    });
  if(!linked.length) return '<div style="font-size:11px;color:var(--tx3);padding:6px 0">연결된 항목이 없습니다</div>';

  var SHOW = 3;
  var typeLabel={task:'업무',issue:'이슈',idea:'아이디어',supply:'필요물품'};
  var dotCls={none:'none-dot',ing:'ing',done:'done'};
  var pm=PGMETA; var bm=BUY_META;

  function itemHtml(itm, idx, total){
    var isSup=itm.type==='supply';
    var meta=isSup?bm:pm;
    var prog=meta[itm.progress||'none']||meta.none;
    var dc=dotCls[itm.progress||'none']||'none-dot';
    var isDone=itm.progress==='done';
    var dd=itm.dueDate?dday(itm.dueDate):null;
    var dueTxt='';
    if(itm.dueDate){
      var dstr=itm.dueDate;
      if(dd!==null&&dd<0&&!isDone) dueTxt='<span class="tl-due overdue">'+dstr+' (D+'+Math.abs(dd)+')</span>';
      else dueTxt='<span class="tl-due">'+dstr+(dd===0?' (D-Day)':dd===1?' (내일)':'')+'</span>';
    }
    var isLast=idx===total-1;
    return '<div class="tl-item'+(isDone?' tl-done':'')+'">'
      +'<div class="tl-left">'
      +'<div class="tl-dot '+dc+'"></div>'
      +(!isLast?'<div class="tl-line"></div>':'')
      +'</div>'
      +'<div class="tl-right">'
      +'<div class="tl-text" title="'+e(itm.text)+'">'+e(itm.text)+'</div>'
      +'<div class="tl-meta">'
      +'<span class="tl-type">'+e(typeLabel[itm.type]||itm.type)+'</span>'
      +'<span class="tl-prog '+prog.c+'">'+prog.l+'</span>'
      +dueTxt
      +'</div>'
      +'</div>'
      +'</div>';
  }

  var visible = linked.slice(0, SHOW);
  var hidden  = linked.slice(SHOW);

  var html = '<div class="tl-wrap" id="tl-wrap-'+projKey+'">';
  visible.forEach(function(itm,i){ html += itemHtml(itm, i, linked.length); });
  if(hidden.length){
    html += '<div id="tl-extra-'+projKey+'" class="tl-hidden">';
    hidden.forEach(function(itm,i){ html += itemHtml(itm, SHOW+i, linked.length); });
    html += '</div>';
    html += '<button class="tl-toggle" id="tl-tog-'+projKey+'" onclick="tlToggle(\''+projKey+'\')">'
      +'<span id="tl-tog-lbl-'+projKey+'">▼ '+hidden.length+'개 더 보기</span>'
      +'</button>';
  }
  html += '</div>';
  return html;
}

window.tlToggle=function(pk){

  if(!extra||!lbl) return;
  var hidden=extra.classList.contains('tl-hidden');
  extra.classList.toggle('tl-hidden',!hidden);
  lbl.textContent=hidden?'▲ 접기':'▼ '+(extra.querySelectorAll('.tl-item').length)+'개 더 보기';
};

  var mem=(p.members&&p.members.length)?p.members.map(function(m,i){return'<div class="mem-row"><div class="mem-name">'+e(m.name)+'</div><div class="mem-role">'+e(m.role||'')+'</div><button class="mem-del" data-mi="'+i+'">✕</button></div>';}).join(''):'<div style="font-size:11px;color:var(--tx3);padding:3px 0">담당자 없음</div>';
  var goals=p.procGoals||{};
  var phtml=PROCS.map(function(proc){return'<div class="proc-row"><div class="proc-lbl">'+e(proc)+'</div><textarea class="proc-inp" data-proc="'+e(proc)+'" rows="1">'+e(goals[proc]||'')+'</textarea></div>';}).join('');
  var body=document.getElementById('dw-body');
  if(body)body.innerHTML='<div class="dw-field"><div class="dw-lbl">설명</div><textarea class="dw-ta" id="dw-pd">'+e(p.desc||'')+'</textarea></div><div class="dw-field"><div class="dw-lbl">목표</div><textarea class="dw-ta" id="dw-pg">'+e(p.goal||'')+'</textarea></div><div class="dw-row"><div class="dw-field"><div class="dw-lbl">상태</div><select class="dw-sel" id="dw-ps">'+['active','hold','done'].map(function(s){return'<option value="'+s+'"'+((p.status||'active')===s?' selected':'')+'>'+PSMETA[s].l+'</option>';}).join('')+'</select></div><div class="dw-field"><div class="dw-lbl">마감 목표일</div><input class="dw-inp" type="date" id="dw-pdue" value="'+e(p.dueDate||'')+'"></div></div>'
    +'<div class="sdiv">📅 타임라인</div>'+renderTimeline(key)
    +'<div class="sdiv">🏭 공정별 목표</div>'+phtml+'<div class="sdiv">👥 업무분장</div><div id="mem-list">'+mem+'</div><div class="mem-add"><input class="dw-inp" id="dw-mn" placeholder="이름" style="font-size:12px;padding:7px 9px"><input class="dw-inp" id="dw-mr" placeholder="역할" style="font-size:12px;padding:7px 9px"><button class="add-mem-btn" onclick="addMem()">+ 추가</button></div><div class="sdiv">📝 메모</div><div class="dw-field"><textarea class="dw-ta" id="dw-pm">'+e(p.memo||'')+'</textarea></div>';
  var acts=document.getElementById('dw-acts');
  if(acts)acts.innerHTML=(isAdmin()?'<button class="d-btn d-danger" onclick="delProj()">삭제</button>':'')+'<button class="d-btn d-primary" onclick="saveProj()">저장</button>';
  body.querySelectorAll('.mem-del').forEach(function(btn){btn.addEventListener('click',function(){var p2=projects[dwProjKey];if(!p2)return;p2.members.splice(parseInt(this.dataset.mi),1);projects[dwProjKey]=p2;fbSet('projects/'+dwProjKey,p2);openProjDW(dwProjKey);});});
  document.getElementById('dov').classList.add('open');document.getElementById('drawer').classList.add('open');
}
window.addMem=function(){var nm=(document.getElementById('dw-mn').value||'').trim();var rl=(document.getElementById('dw-mr').value||'').trim();if(!nm){toast('이름을 입력해주세요.');return;}var p=projects[dwProjKey];if(!p)return;p.members=p.members||[];p.members.push({name:nm,role:rl});projects[dwProjKey]=p;fbSet('projects/'+dwProjKey,p);openProjDW(dwProjKey);};
window.saveProj=function(){var p=projects[dwProjKey];if(!p)return;p.desc=(document.getElementById('dw-pd').value||'').trim();p.goal=(document.getElementById('dw-pg').value||'').trim();p.status=document.getElementById('dw-ps').value;p.dueDate=(document.getElementById('dw-pdue').value||'');p.memo=(document.getElementById('dw-pm').value||'').trim();p.procGoals=p.procGoals||{};document.querySelectorAll('.proc-inp').forEach(function(ta){p.procGoals[ta.dataset.proc]=ta.value.trim();});projects[dwProjKey]=p;fbSet('projects/'+dwProjKey,p);closeDW();renderProjects();toast('저장됨');};
window.delProj=function(){if(!confirm('삭제하시겠습니까?'))return;delete projects[dwProjKey];fbDel('projects/'+dwProjKey);closeDW();renderProjects();toast('삭제됨');};

/* project modal */
window.openPM=function(){['pm-name','pm-desc'].forEach(function(id){var e2=document.getElementById(id);if(e2)e2.value='';});var ic=document.getElementById('pm-icon');if(ic)ic.value='🏭';var st=document.getElementById('pm-st');if(st)st.value='active';document.getElementById('pm-ov').classList.add('open');};
window.closePM=function(){document.getElementById('pm-ov').classList.remove('open');};
window.pmOvClick=function(ev){if(ev.target===document.getElementById('pm-ov'))closePM();};
window.savePM=function(){
  var nm=(document.getElementById('pm-name').value||'').trim();if(!nm){toast('프로젝트명을 입력해주세요.');return;}
  var cols=['var(--acc2)','rgba(72,199,142,.1)','rgba(245,197,66,.1)','rgba(255,92,92,.1)'];
  var k=uid();
  var proj={name:nm,icon:(document.getElementById('pm-icon').value||'🏭').trim()||'🏭',status:(document.getElementById('pm-st').value)||'active',desc:(document.getElementById('pm-desc').value||'').trim(),color:cols[Object.keys(projects).length%cols.length],members:[],goal:'',memo:'',dueDate:'',procGoals:{}};
  projects[k]=proj;fbSet('projects/'+k,proj);closePM();renderProjects();updateProjSel();toast('프로젝트 추가됨');
};

/* mobile sheet */
window.openSheet=function(){buildForm('sh-form',true);refillProjSel(document.getElementById('sh-form')||document.body);document.getElementById('inp-sheet').classList.add('open');};
window.closeSheet=function(){document.getElementById('inp-sheet').classList.remove('open');};

/* nav */
document.querySelectorAll('.nav-tab').forEach(function(btn){btn.addEventListener('click',function(){showPage(this.dataset.page);});});
document.querySelectorAll('.bnav-btn').forEach(function(btn){btn.addEventListener('click',function(){var p=this.dataset.bnav;if(p==='add'){openSheet();return;}showPage(p);});});

/* init */
renderTopDate();setInterval(renderTopDate,60000);

function onFbReady(){
  document.getElementById('loading').style.display='none';
  var sess=lsGet('ws2-sess');
  if(sess&&sess.id){cu=sess;startApp();}
  else{document.getElementById('login-screen').style.display='flex';}
}
var lBtn=document.getElementById('l-btn');if(lBtn)lBtn.addEventListener('click',doLogin);
['l-id','l-pw'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin();});});

// 타임아웃: 8초 후에도 Firebase 안 되면 안내
var fbTimeout=setTimeout(function(){
  var lt=document.getElementById('load-txt');
  if(lt){lt.textContent='Firebase 로드 실패. 새로고침해주세요.';lt.style.color='var(--err)';}
  var sp=document.querySelector('.spinner');if(sp)sp.style.borderTopColor='var(--err)';
},8000);

function onFbReady(){
  clearTimeout(fbTimeout);
  document.getElementById('loading').style.display='none';
  var sess=lsGet('ws2-sess');
  if(sess&&sess.id){cu=sess;startApp();}
  else{document.getElementById('login-screen').style.display='flex';}
}

// ES module이 먼저 로드됐으면 바로 실행, 아니면 콜백 등록
if(window._fbDone){
  onFbReady();
} else {
  window._onFbReady = onFbReady;
}

})();
</script>
</body>
</html>
