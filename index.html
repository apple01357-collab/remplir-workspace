<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WORKSPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08090d;--sur:#0e1016;--sur2:#141720;--sur3:#1a1e28;
  --bdr:#1c2030;--bdr2:#252b3b;
  --tx:#d8dce8;--tx2:#7c85a2;--tx3:#3f4660;
  --acc:#4f7fff;--acc2:rgba(79,127,255,.12);
  --task:#4f7fff;--issue:#ff5c5c;--idea:#f5c542;--supply:#48c78e;
  --warn:#f5c542;--ok:#48c78e;--err:#ff5c5c;
  --r:12px;--r2:9px;--r3:6px;
  --nav-h:56px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:28px;height:28px;border:3px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--tx3)}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:310px;background:var(--sur);border:1.5px solid var(--bdr2);border-radius:18px;padding:26px 22px}
.login-logo{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;letter-spacing:3px;margin-bottom:4px}
.login-logo span{color:var(--acc)}
.login-sub{font-size:11px;color:var(--tx3);margin-bottom:22px;line-height:1.6}
.l-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.8px;margin-bottom:5px}
.l-inp{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r2);padding:11px 12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;transition:border-color .18s;margin-bottom:11px;-webkit-appearance:none}
.l-inp:focus{border-color:var(--acc)}
.l-inp::placeholder{color:var(--tx3)}
.l-rem{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--tx2);cursor:pointer}
.l-rem input{accent-color:var(--acc);width:15px;height:15px}
.l-btn{width:100%;background:var(--acc);border:none;border-radius:var(--r2);padding:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none}
.l-err{font-size:12px;color:var(--err);margin-top:9px;min-height:16px;text-align:center}

/* APP */
#app{display:none;flex-direction:column;height:100dvh;height:100vh}

/* TOPBAR */
#topbar{display:flex;align-items:center;padding:10px 16px;padding-top:max(10px,var(--st));border-bottom:1px solid var(--bdr);flex-shrink:0;gap:10px;background:var(--bg)}
.logo{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:3px}
.logo span{color:var(--acc)}
#tb-date{font-size:11px;color:var(--tx3)}
#sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);transition:background .3s;flex-shrink:0}
#sync-dot.syncing{background:var(--warn);animation:blink .8s infinite}
#sync-dot.err{background:var(--err)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.user-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--sur2);border:1px solid var(--bdr2);border-radius:20px;padding:4px 9px 4px 5px}
.u-av{width:20px;height:20px;border-radius:50%;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--acc)}
.u-nm{font-size:11px;font-weight:600}
.u-rl{font-size:10px;color:var(--tx3)}
.logout-btn{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:11px;padding:2px 5px;font-family:'Noto Sans KR',sans-serif}

/* PC NAV */
#pc-nav{display:flex;padding:0 16px;border-bottom:1px solid var(--bdr);flex-shrink:0;gap:2px;overflow-x:auto;scrollbar-width:none}
#pc-nav::-webkit-scrollbar{display:none}
.nav-tab{padding:9px 13px;font-size:12px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:'Noto Sans KR',sans-serif}
.nav-tab.active{color:var(--tx);border-bottom-color:var(--acc)}

/* PAGES */
#pages{flex:1;overflow:hidden;display:flex;min-height:0}
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}
#page-dash{flex-direction:row}

/* SCROLL */
.sa{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sa::-webkit-scrollbar{width:3px}
.sa::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}

/* DASH */
#dash-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.dash-pad{padding:13px;padding-bottom:calc(13px + var(--sb))}

.group-row{display:flex;gap:5px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex-wrap:nowrap}
.group-row::-webkit-scrollbar{display:none}
.gc{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--sur);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.gc.active{border-color:var(--acc);background:var(--acc2)}
.gc-cnt{font-size:12px;font-weight:700}
.gc-lbl{font-size:11px;color:var(--tx3)}

#ctx-bar{display:none;margin-bottom:9px;background:var(--sur2);border:1px solid var(--bdr2);border-radius:var(--r2);padding:6px 10px;gap:5px;flex-wrap:wrap;align-items:center}
#ctx-bar.show{display:flex}
.ctx-chip{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--sur3);border:1px solid var(--bdr2);color:var(--tx2);cursor:pointer}
.ctx-chip.active{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.ctx-rst{margin-left:auto;background:none;border:none;color:var(--tx3);font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}

.list-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.list-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px}
.list-cnt{font-size:11px;color:var(--tx3)}
#item-list{display:flex;flex-direction:column;gap:3px}

/* ITEM CARD */
.ic{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r2);background:var(--sur);border:1px solid var(--bdr);cursor:pointer;transition:background .15s;-webkit-user-select:none;user-select:none}
.ic:active{background:var(--sur2)}
@media(hover:hover){.ic:hover{background:var(--sur2);border-color:var(--bdr2)}}
.ic-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-t{background:var(--task)}.dot-i{background:var(--issue)}.dot-d{background:var(--idea)}.dot-s{background:var(--supply)}
.ic-text{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-meta{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ic-done{opacity:.35}.ic-done .ic-text{text-decoration:line-through}
.cat-tag{font-size:10px;background:var(--sur2);border:1px solid var(--bdr2);border-radius:3px;padding:1px 5px;color:var(--tx2)}
.prj-tag{font-size:10px;font-weight:600;background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.22);border-radius:3px;padding:1px 6px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio-dot{color:var(--err);font-size:10px;flex-shrink:0}
.dday{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.dd-u{background:rgba(255,92,92,.15);color:var(--err)}.dd-s{background:rgba(245,197,66,.12);color:var(--warn)}.dd-ok{background:rgba(72,199,142,.1);color:var(--ok)}
.prog{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.pn{background:var(--sur3);color:var(--tx3);border:1px solid var(--bdr2)}
.pi{background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.25)}
.pd{background:rgba(72,199,142,.1);color:var(--ok);border:1px solid rgba(72,199,142,.2)}
.pbn{background:rgba(245,197,66,.1);color:var(--warn);border:1px solid rgba(245,197,66,.2)}
.pbi{background:var(--acc2);color:var(--acc);border:1px solid rgba(79,127,255,.25)}
.pbd{background:rgba(72,199,142,.1);color:var(--ok);border:1px solid rgba(72,199,142,.2)}

.empty{display:flex;flex-direction:column;align-items:center;padding:36px 0;color:var(--tx3);gap:6px}
.empty-icon{font-size:22px;opacity:.4}.empty-text{font-size:12px}

/* INPUT PANEL (PC) */
#inp-panel{width:280px;flex-shrink:0;background:var(--sur);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:11px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.ph-title{font-size:12px;font-weight:700;margin-bottom:1px}
.ph-sub{font-size:11px;color:var(--tx3)}
.pb{flex:1;overflow-y:auto;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.pb::-webkit-scrollbar{width:3px}
.pb::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.p-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:4px}
.p-sel,.p-inp,.p-ta{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r2);padding:7px 9px;font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none;transition:border-color .18s;-webkit-appearance:none}
.p-sel:focus,.p-inp:focus,.p-ta:focus{border-color:var(--acc)}
.p-sel option{background:var(--sur2)}
.p-ta{resize:none;min-height:58px;line-height:1.6}
.p-inp::placeholder,.p-ta::placeholder{color:var(--tx3)}
.p-submit{width:100%;background:var(--acc);border:none;border-radius:var(--r2);padding:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none}
.ptog{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx3);border-radius:var(--r2);padding:7px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.ptog.hi{background:rgba(255,92,92,.1);border-color:var(--err);color:var(--err)}

/* TODAY */
#page-today{overflow:hidden}
.today-pad{padding:16px;padding-bottom:calc(16px + var(--sb))}
.today-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.today-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.today-sub{font-size:11px;color:var(--tx3)}
.today-sec{margin-bottom:18px}
.tsec-title{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.tsec-title::after{content:'';flex:1;height:1px;background:var(--bdr)}
.t-items{display:flex;flex-direction:column;gap:3px}

/* PROJECT */
#page-project{overflow:hidden}
.proj-pad{padding:16px;padding-bottom:calc(16px + var(--sb))}
.proj-topbar{display:flex;align-items:center;margin-bottom:14px}
.proj-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
.proj-add-btn{margin-left:auto;background:var(--acc);border:none;border-radius:var(--r2);padding:7px 13px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.proj-card{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--r);padding:13px;cursor:pointer;transition:all .18s}
.proj-card:active{background:var(--sur2)}
@media(hover:hover){.proj-card:hover{background:var(--sur2);border-color:var(--bdr2)}}
.pc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.pc-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pc-name{font-size:13px;font-weight:700;margin-bottom:2px}
.ps-badge{font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;display:inline-block}
.ps-a{background:rgba(79,127,255,.1);color:var(--acc)}.ps-h{background:rgba(245,197,66,.1);color:var(--warn)}.ps-d{background:rgba(72,199,142,.1);color:var(--ok)}
.pc-desc{font-size:11px;color:var(--tx3);line-height:1.6;margin-bottom:7px}
.pc-meta{display:flex;gap:7px;font-size:10px;color:var(--tx3);flex-wrap:wrap}

/* DRAWER */
#dov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
#dov.open{opacity:1;pointer-events:all}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--sur);border-left:1px solid var(--bdr2);z-index:101;transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
#drawer.open{transform:translateX(0)}
#dw-head{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;padding-top:max(13px,var(--st));border-bottom:1px solid var(--bdr);flex-shrink:0}
#dw-title{flex:1;font-size:14px;font-weight:700;line-height:1.5}
#dw-close{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
#dw-body{flex:1;overflow-y:auto;padding:13px 15px;-webkit-overflow-scrolling:touch}
#dw-body::-webkit-scrollbar{width:3px}
#dw-body::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.dw-field{margin-bottom:13px}
.dw-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:5px}
.dw-inp,.dw-ta,.dw-sel{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r2);padding:9px 11px;font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;transition:border-color .18s;-webkit-appearance:none}
.dw-inp:focus,.dw-ta:focus,.dw-sel:focus{border-color:var(--acc)}
.dw-ta{resize:vertical;min-height:76px;line-height:1.6}
.dw-sel option{background:var(--sur2)}
.dw-row{display:flex;gap:8px;margin-bottom:13px}
.dw-row .dw-field{flex:1;margin-bottom:0}
#dw-acts{display:flex;gap:8px;padding:11px 15px;padding-bottom:max(11px,var(--sb));border-top:1px solid var(--bdr);flex-shrink:0}
.d-btn{flex:1;border:none;border-radius:var(--r2);padding:11px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.d-primary{background:var(--acc);color:#fff}
.d-danger{background:none;border:1px solid rgba(255,92,92,.3);color:var(--err)}
.dw-ptog{width:100%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx3);border-radius:var(--r2);padding:9px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.dw-ptog.hi{background:rgba(255,92,92,.1);border-color:var(--err);color:var(--err)}

.prj-link{background:var(--sur2);border:1px solid var(--bdr2);border-radius:var(--r2);padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prj-link-name{font-size:12px;font-weight:600;color:var(--acc);flex:1}
.prj-link-none{font-size:12px;color:var(--tx3)}
.prj-unlink{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:12px}
.sdiv{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin:13px 0 9px;display:flex;align-items:center;gap:7px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--bdr)}
.proc-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px}
.proc-lbl{font-size:11px;font-weight:700;color:var(--tx2);min-width:58px;padding-top:8px;flex-shrink:0}
.proc-inp{flex:1;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--tx);border-radius:var(--r3);padding:7px 9px;font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none;transition:border-color .18s;resize:none;min-height:32px;line-height:1.5}
.proc-inp:focus{border-color:var(--acc)}
.proc-inp::placeholder{color:var(--tx3)}
.mem-row{display:flex;align-items:center;gap:7px;background:var(--sur2);border-radius:var(--r3);padding:6px 9px;margin-bottom:4px}
.mem-name{flex:1;font-size:12px}.mem-role{font-size:11px;color:var(--tx3)}
.mem-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:13px}
.mem-add{display:flex;gap:5px;margin:7px 0}
.add-mem-btn{background:none;border:1px solid var(--bdr2);color:var(--tx2);border-radius:var(--r3);padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.com-item{background:var(--sur2);border-radius:var(--r3);padding:8px 10px;font-size:12px;margin-bottom:5px}
.com-meta{font-size:10px;color:var(--tx3);margin-bottom:3px}
.com-text{color:var(--tx2);line-height:1.6}
.com-form{display:flex;gap:6px}
.com-send{background:var(--acc);border:none;border-radius:var(--r3);padding:8px 12px;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0}

/* MODAL */
#pm-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#pm-ov.open{opacity:1;pointer-events:all}
#pm-box{background:var(--sur);border:1.5px solid var(--bdr2);border-radius:16px;padding:22px 20px;width:100%;max-width:330px;transform:scale(.96);transition:transform .2s}
#pm-ov.open #pm-box{transform:scale(1)}
.m-title{font-size:14px;font-weight:700;margin-bottom:14px}
.m-field{margin-bottom:11px}
.m-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.7px;margin-bottom:5px}
.m-acts{display:flex;gap:8px;margin-top:14px}
.m-btn{flex:1;border:none;border-radius:var(--r2);padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.m-primary{background:var(--acc);color:#fff}
.m-ghost{background:none;border:1px solid var(--bdr2);color:var(--tx2)}

/* BOTTOM NAV */
#bnav{display:none;flex-shrink:0;border-top:1px solid var(--bdr);background:var(--bg);padding-bottom:var(--sb)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;gap:3px;background:none;border:none;color:var(--tx3);font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.bnav-btn.active{color:var(--acc)}
.bnav-ico{font-size:18px;line-height:1}
.bnav-lbl{font-size:9px;font-weight:600}

/* INPUT SHEET (mobile) */
#inp-sheet{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
#inp-sheet.open{opacity:1;pointer-events:all}
#inp-sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#inp-sheet-body{position:relative;background:var(--sur);border-radius:20px 20px 0 0;border-top:1px solid var(--bdr2);max-height:88dvh;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--sb)}
.sheet-handle{width:34px;height:4px;background:var(--bdr2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.sheet-title{font-size:14px;font-weight:700}
.sheet-x{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer}
.sheet-scroll{flex:1;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.sheet-scroll::-webkit-scrollbar{display:none}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 14px + var(--sb));left:50%;transform:translateX(-50%) translateY(6px);background:var(--sur2);border:1px solid var(--bdr2);border-radius:10px;padding:9px 16px;font-size:12px;font-weight:600;color:var(--tx);opacity:0;transition:all .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* FAB */
#fab{position:fixed;bottom:calc(var(--nav-h) + 12px + var(--sb));right:16px;z-index:50;width:46px;height:46px;border-radius:13px;background:var(--acc);border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(79,127,255,.4);display:none;align-items:center;justify-content:center}

/* RESPONSIVE */
@media(max-width:768px){
  #pc-nav{display:none}
  #bnav{display:flex}
  #page-dash{flex-direction:column}
  #inp-panel{display:none}
  #fab{display:flex}
  .dash-pad,.today-pad,.proj-pad{padding-bottom:calc(13px + var(--nav-h) + var(--sb))}
}
@media(min-width:769px){
  #bnav{display:none}
  #inp-sheet{display:none!important}
  #fab{display:none!important}
}

/* ── TIMELINE ── */
.tl-wrap{margin-top:6px}
.tl-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--bdr);
  position:relative;
}
.tl-item:last-child{border-bottom:none}
.tl-item.tl-done .tl-text{opacity:.5;text-decoration:line-through}
.tl-left{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:14px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid var(--bdr2);background:var(--sur2)}
.tl-dot.done{background:var(--ok);border-color:var(--ok)}
.tl-dot.ing{background:var(--acc);border-color:var(--acc)}
.tl-dot.none-dot{background:var(--sur3);border-color:var(--bdr2)}
.tl-line{width:2px;flex:1;background:var(--bdr);min-height:14px}
.tl-right{flex:1;min-width:0}
.tl-text{font-size:12px;color:var(--tx);line-height:1.4;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-prog{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.tl-type{font-size:10px;color:var(--tx3)}
.tl-due{font-size:10px;color:var(--tx3)}
.tl-due.overdue{color:var(--err)}
.tl-toggle{
  width:100%;background:none;border:1px solid var(--bdr2);color:var(--tx3);
  border-radius:var(--r3);padding:6px;font-size:11px;font-weight:600;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s
}
.tl-toggle:hover{border-color:var(--acc);color:var(--acc)}
.tl-hidden{display:none}
</style>
</head>

<!-- Firebase via ES module -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyB6jns6vqqXkh63HF8JyopOPQggM3itKS0",
  authDomain:"remplir-workspace-pilot-92963.firebaseapp.com",
  databaseURL:"https://remplir-workspace-pilot-92963-default-rtdb.firebaseio.com",
  projectId:"remplir-workspace-pilot-92963",
  storageBucket:"remplir-workspace-pilot-92963.firebasestorage.app",
  messagingSenderId:"375235736390",
  appId:"1:375235736390:web:4b62924e5c0e138465ab47"
};

try {
  const app = initializeApp(cfg);
  const db  = getDatabase(app);

  window._fb = {
    refFn: (p) => ref(db, p),
    makeRef: (path) => {
      const r = ref(db, path);
      let unsub = null;
      return {
        on: (evt, cb, errCb) => {
          unsub = onValue(r, cb, errCb || (() => {}));
        },
        off: () => { if(unsub) unsub(); }
      };
    },
    setVal: (path, data) => set(ref(db, path), data),
    delVal: (path) => remove(ref(db, path))
  };
} catch(err) {
  console.error("Firebase init error:", err);
}

// ES module runs after defer — call onFbReady if already waiting
if(typeof window._onFbReady === 'function') {
  window._onFbReady();
} else {
  window._fbDone = true;
}
</script>

<script>
(function(){
'use strict';
var DAYS=['일','월','화','수','목','금','토'];
var CATS=['믹싱','코팅','프레싱','시설관리','부품구매','기타'];
var PROCS=['믹싱','코팅','프레싱','시설관리','부품구매','기타'];
var PSMETA={active:{l:'진행중',c:'ps-a'},hold:{l:'보류',c:'ps-h'},done:{l:'완료',c:'ps-d'}};
var PGMETA={none:{l:'시작 전',c:'pn'},ing:{l:'진행 중',c:'pi'},done:{l:'진행 완료',c:'pd'}};
var BYMETA={none:{l:'구매 전',c:'pbn'},ing:{l:'구매 확정',c:'pbi'},done:{l:'구매 완료',c:'pbd'}};
var DEFAULT_ACCOUNTS={admin:{pw:'ws2024',role:'admin'},user1:{pw:'pass1234',role:'user'}};

var items={}, projects={}, accounts=DEFAULT_ACCOUNTS;
var curPage='today', curGroup=null, curCat=null;
var dwItemKey=null, dwProjKey=null;
var cu=null; // currentUser
var unsubs=[];

/* utils */
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isAdmin(){return cu&&cu.role==='admin';}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function dday(s){if(!s)return null;var d=new Date(s);d.setHours(0,0,0,0);return Math.round((d-today0())/86400000);}
function fmtTs(ts){var d=new Date(ts);return(d.getMonth()+1)+'/'+d.getDate()+' ('+DAYS[d.getDay()]+')';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}
function sync(s){var d=document.getElementById('sync-dot');if(!d)return;d.className=s||'';}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function renderTopDate(){var d=new Date();var el=document.getElementById('tb-date');if(el)el.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';}

/* fb write */
function fbSet(path,data){
  if(!window._fb){console.warn('FB not ready');return;}
  sync('syncing');
  window._fb.setVal(path,data)
    .then(function(){sync('');})
    .catch(function(err){console.error(err);sync('err');toast('저장 실패');});
}
function fbDel(path){
  if(!window._fb){console.warn('FB not ready');return;}
  sync('syncing');
  window._fb.delVal(path)
    .then(function(){sync('');})
    .catch(function(){sync('err');});
}

/* auth */
function doLogin(){
  var id=(document.getElementById('l-id').value||'').trim();
  var pw=document.getElementById('l-pw').value||'';
  var rem=document.getElementById('l-rem').checked;
  var err=document.getElementById('l-err');
  if(!id||!pw){if(err)err.textContent='아이디와 비밀번호를 입력해주세요.';return;}
  var a=Object.keys(accounts).length?accounts:DEFAULT_ACCOUNTS;
  if(!a[id]||a[id].pw!==pw){if(err)err.textContent='아이디 또는 비밀번호가 틀렸습니다.';document.getElementById('l-pw').value='';return;}
  cu={id:id,role:a[id].role};
  if(rem)lsSet('ws2-sess',cu); else lsDel('ws2-sess');
  startApp();
}
window.doLogout=function(){
  lsDel('ws2-sess');cu=null;
  unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];
  items={};projects={};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('l-id').value='';document.getElementById('l-pw').value='';
  var er=document.getElementById('l-err');if(er)er.textContent='';
};

/* firebase subscribe */
function subscribe(){
  var fb=window._fb;
  if(!fb){ console.warn('Firebase not ready'); return; }
  sync('syncing');

  var r1=fb.makeRef('accounts');
  r1.on('value',function(s){var v=s.val();if(v)accounts=v;});
  unsubs.push(function(){ r1.off(); });

  var r2=fb.makeRef('items');
  r2.on('value',function(s){items=s.val()||{};sync('');renderAll();},function(){sync('err');});
  unsubs.push(function(){ r2.off(); });

  var r3=fb.makeRef('projects');
  r3.on('value',function(s){projects=s.val()||{};if(curPage==='project')renderProjects();updateProjSel();});
  unsubs.push(function(){ r3.off(); });
}

function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  var av=document.getElementById('u-av');if(av)av.textContent=cu.id[0].toUpperCase();
  var nm=document.getElementById('u-nm');if(nm)nm.textContent=cu.id;
  var rl=document.getElementById('u-rl');if(rl)rl.textContent=isAdmin()?'관리자':'팀원';
  buildForm('pc-form',false);
  subscribe();
  renderTopDate();setInterval(renderTopDate,60000);
  showPage('today');
}

/* page */
function showPage(p){
  curPage=p;
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.toggle('active',t.dataset.page===p);});
  document.querySelectorAll('.page').forEach(function(el){el.classList.toggle('active',el.id==='page-'+p);});
  document.querySelectorAll('.bnav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.bnav===p);});
  if(p==='today')renderToday();
  if(p==='dash')render();
  if(p==='project')renderProjects();
}
window.showPage=showPage;
function renderAll(){if(curPage==='today')renderToday();if(curPage==='dash')render();}

/* item helpers */
function arr(){return Object.entries(items).map(function(e){return Object.assign({},e[1],{_k:e[0]});});}
function getItm(k){return items[k]?Object.assign({},items[k],{_k:k}):null;}

/* badges */
function progBadge(item){var m=item.type==='supply'?BYMETA:PGMETA;var pm=m[item.progress||'none']||m.none;return'<span class="prog '+pm.c+'">'+pm.l+'</span>';}
function ddayBadge(item){if(item.progress==='done')return'';var dd=dday(item.dueDate);if(dd===null)return'';var c=dd<0||dd<=2?'dd-u':dd<=7?'dd-s':'dd-ok';var t=dd<0?'D+'+Math.abs(dd):dd===0?'D-Day':'D-'+dd;return'<span class="dday '+c+'">'+t+'</span>';}

/* card html */
function cardHtml(item,extra){
  extra=extra||'';
  var dc={task:'dot-t',issue:'dot-i',idea:'dot-d',supply:'dot-s'}[item.type]||'dot-t';
  var isDone=item.progress==='done';
  var cat=item.cat?'<span class="cat-tag">'+e(item.cat)+'</span>':'';
  var prj='';if(item.projKey){var p=projects[item.projKey];if(p)prj='<span class="prj-tag">'+(p.icon||'🏭')+' '+e(p.name)+'</span>';}
  var pio=item.priority==='high'?'<span class="prio-dot">●</span>':'';
  return'<div class="ic'+(isDone?' ic-done':'')+'" data-k="'+item._k+'">'
    +'<div class="ic-dot '+dc+'"></div>'+extra+pio
    +'<div class="ic-text">'+e(item.text)+'</div>'
    +'<div class="ic-meta">'+cat+prj+progBadge(item)+ddayBadge(item)+'</div>'
    +'</div>';
}
function bindCards(el){el.querySelectorAll('.ic').forEach(function(c){c.addEventListener('click',function(){openDW(this.dataset.k);});});}

/* today */
function renderToday(){
  var d=new Date();var sub=document.getElementById('today-sub');
  if(sub)sub.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';
  var a=arr();var wEnd=today0().getTime()+7*86400000;
  var urgent=a.filter(function(x){if(x.progress==='done')return false;if(x.priority==='high')return true;var dd=dday(x.dueDate);return dd!==null&&dd<=2;});
  var inp=a.filter(function(x){return x.type==='task'&&x.progress==='ing';}).sort(function(a,b){var aw=a.dueDate&&new Date(a.dueDate).getTime()<=wEnd;var bw=b.dueDate&&new Date(b.dueDate).getTime()<=wEnd;if(aw&&!bw)return-1;if(!aw&&bw)return 1;if(a.dueDate&&b.dueDate)return new Date(a.dueDate)-new Date(b.dueDate);return 0;});
  function setList(id,arr,em){var el=document.getElementById(id);if(!el)return;if(!arr.length){el.innerHTML='<div class="empty" style="padding:10px 0"><div class="empty-text" style="font-size:11px">'+em+'</div></div>';return;}
    el.innerHTML=arr.map(function(item){var isW=item.dueDate&&new Date(item.dueDate).getTime()<=wEnd;var ex=item.type==='task'&&isW&&item.progress!=='done'?'<span style="font-size:12px;margin-right:2px">📅</span>':'';return cardHtml(item,ex);}).join('');bindCards(el);}
  setList('t-urgent',urgent,'우선임무 없음');
  setList('t-inprog',inp,'진행 중 업무 없음');
}

/* dash */
function renderGR(){
  var el=document.getElementById('group-row');if(!el)return;
  var a=arr();var cnt={task:0,issue:0,idea:0,supply:0};
  a.forEach(function(x){if(x.progress!=='done'&&cnt[x.type]!==undefined)cnt[x.type]++;});
  var tot=a.filter(function(x){return x.progress!=='done';}).length;
  [{k:null,l:'전체',n:tot},{k:'task',l:'업무',n:cnt.task},{k:'issue',l:'이슈',n:cnt.issue},{k:'idea',l:'아이디어',n:cnt.idea},{k:'supply',l:'필요물품',n:cnt.supply}]
    .forEach(function(g,i){});
  el.innerHTML=[{k:null,l:'전체',n:tot},{k:'task',l:'업무',n:cnt.task},{k:'issue',l:'이슈',n:cnt.issue},{k:'idea',l:'아이디어',n:cnt.idea},{k:'supply',l:'필요물품',n:cnt.supply}]
    .map(function(g){return'<div class="gc'+(curGroup===g.k?' active':'')+'" data-gk="'+(g.k||'')+'"><span class="gc-cnt">'+g.n+'</span><span class="gc-lbl">'+g.l+'</span></div>';}).join('');
  el.querySelectorAll('.gc').forEach(function(el){el.addEventListener('click',function(){var k=this.dataset.gk||null;curGroup=(curGroup===k)?null:k;curCat=null;render();});});
}
function renderCtx(){
  var bar=document.getElementById('ctx-bar');if(!bar)return;
  var a=arr();var f=curGroup?a.filter(function(x){return x.type===curGroup;}):a;
  var used=CATS.filter(function(c){return f.some(function(x){return x.cat===c;});});
  var show=curGroup&&curGroup!=='supply'&&used.length>0;

  }).join('');

function renderTimeline(projKey){
  // gather items linked to this project, sorted by dueDate then ts
  var linked = Object.entries(items)
    .filter(function(e2){ return e2[1].projKey===projKey; })
    .map(function(e2){ return Object.assign({},e2[1],{_k:e2[0]}); })
    .sort(function(a,b){
      // done items go to bottom
      var ad=a.progress==='done'?1:0, bd=b.progress==='done'?1:0;
      if(ad!==bd) return ad-bd;
      if(a.dueDate&&b.dueDate) return new Date(a.dueDate)-new Date(b.dueDate);
      if(a.dueDate) return -1; if(b.dueDate) return 1;
      return (a.ts||0)-(b.ts||0);
    });
  if(!linked.length) return '<div style="font-size:11px;color:var(--tx3);padding:6px 0">연결된 항목이 없습니다</div>';

  var SHOW = 3;
  var typeLabel={task:'업무',issue:'이슈',idea:'아이디어',supply:'필요물품'};
  var dotCls={none:'none-dot',ing:'ing',done:'done'};
  var pm=PGMETA; var bm=BUY_META;

  function itemHtml(itm, idx, total){
    var isSup=itm.type==='supply';
    var meta=isSup?bm:pm;
    var prog=meta[itm.progress||'none']||meta.none;
    var dc=dotCls[itm.progress||'none']||'none-dot';
    var isDone=itm.progress==='done';
    var dd=itm.dueDate?dday(itm.dueDate):null;
    var dueTxt='';
    if(itm.dueDate){
      var dstr=itm.dueDate;
      if(dd!==null&&dd<0&&!isDone) dueTxt='<span class="tl-due overdue">'+dstr+' (D+'+Math.abs(dd)+')</span>';
      else dueTxt='<span class="tl-due">'+dstr+(dd===0?' (D-Day)':dd===1?' (내일)':'')+'</span>';
    }
    var isLast=idx===total-1;
    return '<div class="tl-item'+(isDone?' tl-done':'')+'">'
      +'<div class="tl-left">'
      +'<div class="tl-dot '+dc+'"></div>'
      +(!isLast?'<div class="tl-line"></div>':'')
      +'</div>'
      +'<div class="tl-right">'
      +'<div class="tl-text" title="'+e(itm.text)+'">'+e(itm.text)+'</div>'
      +'<div class="tl-meta">'
      +'<span class="tl-type">'+e(typeLabel[itm.type]||itm.type)+'</span>'
      +'<span class="tl-prog '+prog.c+'">'+prog.l+'</span>'
      +dueTxt
      +'</div>'
      +'</div>'
      +'</div>';
  }

  var visible = linked.slice(0, SHOW);
  var hidden  = linked.slice(SHOW);

  var html = '<div class="tl-wrap" id="tl-wrap-'+projKey+'">';
  visible.forEach(function(itm,i){ html += itemHtml(itm, i, linked.length); });
  if(hidden.length){
    html += '<div id="tl-extra-'+projKey+'" class="tl-hidden">';
    hidden.forEach(function(itm,i){ html += itemHtml(itm, SHOW+i, linked.length); });
    html += '</div>';
    html += '<button class="tl-toggle" id="tl-tog-'+projKey+'" onclick="tlToggle(\''+projKey+'\')">'
      +'<span id="tl-tog-lbl-'+projKey+'">▼ '+hidden.length+'개 더 보기</span>'
      +'</button>';
  }
  html += '</div>';
  return html;
}

window.delProj=function(){if(!confirm('삭제하시겠습니까?'))return;delete projects[dwProjKey];fbDel('projects/'+dwProjKey);closeDW();renderProjects();toast('삭제됨');};

/* project modal */
window.openPM=function(){['pm-name','pm-desc'].forEach(function(id){var e2=document.getElementById(id);if(e2)e2.value='';});var ic=document.getElementById('pm-icon');if(ic)ic.value='🏭';var st=document.getElementById('pm-st');if(st)st.value='active';document.getElementById('pm-ov').classList.add('open');};
window.closePM=function(){document.getElementById('pm-ov').classList.remove('open');};
window.pmOvClick=function(ev){if(ev.target===document.getElementById('pm-ov'))closePM();};
window.savePM=function(){
  var nm=(document.getElementById('pm-name').value||'').trim();if(!nm){toast('프로젝트명을 입력해주세요.');return;}
  var cols=['var(--acc2)','rgba(72,199,142,.1)','rgba(245,197,66,.1)','rgba(255,92,92,.1)'];
  var k=uid();
  var proj={name:nm,icon:(document.getElementById('pm-icon').value||'🏭').trim()||'🏭',status:(document.getElementById('pm-st').value)||'active',desc:(document.getElementById('pm-desc').value||'').trim(),color:cols[Object.keys(projects).length%cols.length],members:[],goal:'',memo:'',dueDate:'',procGoals:{}};
  projects[k]=proj;fbSet('projects/'+k,proj);closePM();renderProjects();updateProjSel();toast('프로젝트 추가됨');
};

/* mobile sheet */
window.openSheet=function(){buildForm('sh-form',true);refillProjSel(document.getElementById('sh-form')||document.body);document.getElementById('inp-sheet').classList.add('open');};
window.closeSheet=function(){document.getElementById('inp-sheet').classList.remove('open');};

/* nav */
document.querySelectorAll('.nav-tab').forEach(function(btn){btn.addEventListener('click',function(){showPage(this.dataset.page);});});
document.querySelectorAll('.bnav-btn').forEach(function(btn){btn.addEventListener('click',function(){var p=this.dataset.bnav;if(p==='add'){openSheet();return;}showPage(p);});});

/* init */
renderTopDate();setInterval(renderTopDate,60000);

function onFbReady(){
  document.getElementById('loading').style.display='none';
  var sess=lsGet('ws2-sess');
  if(sess&&sess.id){cu=sess;startApp();}
  else{document.getElementById('login-screen').style.display='flex';}
}
var lBtn=document.getElementById('l-btn');if(lBtn)lBtn.addEventListener('click',doLogin);
['l-id','l-pw'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('keydown',function(ev){if(ev.key==='Enter')doLogin();});});

// 타임아웃: 8초 후에도 Firebase 안 되면 안내
var fbTimeout=setTimeout(function(){
  var lt=document.getElementById('load-txt');
  if(lt){lt.textContent='Firebase 로드 실패. 새로고침해주세요.';lt.style.color='var(--err)';}
  var sp=document.querySelector('.spinner');if(sp)sp.style.borderTopColor='var(--err)';
},8000);

function onFbReady(){
  clearTimeout(fbTimeout);
  document.getElementById('loading').style.display='none';
  var sess=lsGet('ws2-sess');
  if(sess&&sess.id){cu=sess;startApp();}
  else{document.getElementById('login-screen').style.display='flex';}
}

// ES module이 먼저 로드됐으면 바로 실행, 아니면 콜백 등록
if(window._fbDone){
  onFbReady();
} else {
  window._onFbReady = onFbReady;
}

})();
</script>
</body>
</html>
